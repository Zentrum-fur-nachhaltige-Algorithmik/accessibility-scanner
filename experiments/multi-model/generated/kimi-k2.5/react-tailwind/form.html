<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Company Name</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        company: '',
        department: '',
        message: '',
        terms: false
      });

      const [errors, setErrors] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [touched, setTouched] = useState({});
      
      const errorSummaryRef = useRef(null);
      const mainRef = useRef(null);

      useEffect(() => {
        if (Object.keys(errors).length > 0 && errorSummaryRef.current) {
          errorSummaryRef.current.focus();
        }
      }, [errors]);

      const validate = (values) => {
        const newErrors = {};
        
        if (!values.name.trim()) {
          newErrors.name = 'Please enter your name';
        }
        
        if (!values.email.trim()) {
          newErrors.email = 'Please enter your email address';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
          newErrors.email = 'Please enter a valid email address';
        }
        
        if (!values.phone.trim()) {
          newErrors.phone = 'Please enter your phone number';
        } else if (!/^[\d\s+\-().]+$/.test(values.phone)) {
          newErrors.phone = 'Please enter a valid phone number';
        }
        
        if (!values.department) {
          newErrors.department = 'Please select a department';
        }
        
        if (!values.message.trim()) {
          newErrors.message = 'Please enter a message';
        } else if (values.message.trim().length < 10) {
          newErrors.message = 'Message must be at least 10 characters';
        }
        
        if (!values.terms) {
          newErrors.terms = 'You must agree to the terms and conditions';
        }
        
        return newErrors;
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        const val = type === 'checkbox' ? checked : value;
        
        setFormData(prev => ({ ...prev, [name]: val }));
        
        if (errors[name]) {
          setErrors(prev => {
            const newErrors = { ...prev };
            delete newErrors[name];
            return newErrors;
          });
        }
      };

      const handleBlur = (e) => {
        const { name } = e.target;
        setTouched(prev => ({ ...prev, [name]: true }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate(formData);
        
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
        } else {
          setErrors({});
          setIsSubmitted(true);
          setFormData({
            name: '',
            email: '',
            phone: '',
            company: '',
            department: '',
            message: '',
            terms: false
          });
          setTouched({});
          setTimeout(() => {
            if (mainRef.current) mainRef.current.focus();
          }, 0);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <a 
            href="#main-content" 
            className="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 z-50 bg-blue-700 text-white px-4 py-2 rounded font-medium focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
          >
            Skip to main content
          </a>

          <header className="bg-gray-800 text-white">
            <div className="max-w-4xl mx-auto px-4 py-4">
              <div className="flex justify-between items-center">
                <div className="text-xl font-bold">Company Name</div>
                <nav aria-label="Main navigation">
                  <ul className="flex space-x-6">
                    <li>
                      <a href="#home" className="text-white hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-gray-800 rounded px-1">
                        Home
                      </a>
                    </li>
                    <li>
                      <a href="#about" className="text-white hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-gray-800 rounded px-1">
                        About
                      </a>
                    </li>
                    <li>
                      <a href="#contact" aria-current="page" className="text-white underline focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-gray-800 rounded px-1">
                        Contact
                      </a>
                    </li>
                  </ul>
                </nav>
              </div>
            </div>
          </header>

          <main 
            id="main-content" 
            ref={mainRef}
            tabIndex={-1}
            className="flex-grow max-w-4xl mx-auto px-4 py-8 w-full outline-none"
          >
            <h1 className="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
            <p className="text-gray-600 mb-8 text-lg">
              Please fill out the form below. Required fields are marked with an asterisk (<span aria-hidden="true">*</span>).
            </p>

            {isSubmitted ? (
              <div 
                role="alert" 
                className="bg-green-50 border border-green-700 text-green-900 p-6 rounded-lg"
                tabIndex={-1}
              >
                <h2 className="text-xl font-bold mb-2">Thank you!</h2>
                <p className="mb-4">Your message has been sent successfully. We will get back to you within 24 hours.</p>
                <button 
                  onClick={() => setIsSubmitted(false)}
                  className="bg-blue-700 text-white px-6 py-2 rounded hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 font-medium"
                >
                  Send another message
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} noValidate className="space-y-6">
                {Object.keys(errors).length > 0 && (
                  <div 
                    ref={errorSummaryRef}
                    tabIndex={-1}
                    role="alert"
                    className="bg-red-50 border border-red-700 text-red-900 p-4 rounded-lg outline-none"
                  >
                    <h2 className="text-lg font-bold mb-2">There are {Object.keys(errors).length} errors in this form:</h2>
                    <ul className="list-disc list-inside space-y-1">
                      {errors.name && <li><a href="#name" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.name}</a></li>}
                      {errors.email && <li><a href="#email" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.email}</a></li>}
                      {errors.phone && <li><a href="#phone" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.phone}</a></li>}
                      {errors.department && <li><a href="#department" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.department}</a></li>}
                      {errors.message && <li><a href="#message" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.message}</a></li>}
                      {errors.terms && <li><a href="#terms" className="underline text-red-900 hover:text-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 rounded">{errors.terms}</a></li>}
                    </ul>
                  </div>
                )}

                <div className="space-y-6">
                  <div>
                    <label htmlFor="name" className="block text-gray-900 font-medium mb-1">
                      Full Name <span aria-hidden="true">*</span>
                      <span className="sr-only">(required)</span>
                    </label>
                    <input
                      type="text"
                      id="name"
                      name="name"
                      value={formData.name}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      autoComplete="name"
                      aria-required="true"
                      aria-invalid={errors.name ? "true" : undefined}
                      aria-describedby={errors.name ? "name-error" : undefined}
                      className={`w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900 ${errors.name ? 'border-red-700' : 'border-gray-500'}`}
                    />
                    {errors.name && (
                      <p id="name-error" className="mt-1 text-red-900 text-sm font-medium">
                        {errors.name}
                      </p>
                    )}
                  </div>

                  <div>
                    <label htmlFor="email" className="block text-gray-900 font-medium mb-1">
                      Email Address <span aria-hidden="true">*</span>
                      <span className="sr-only">(required)</span>
                    </label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      value={formData.email}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      autoComplete="email"
                      aria-required="true"
                      aria-invalid={errors.email ? "true" : undefined}
                      aria-describedby={errors.email ? "email-error" : undefined}
                      className={`w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900 ${errors.email ? 'border-red-700' : 'border-gray-500'}`}
                    />
                    {errors.email && (
                      <p id="email-error" className="mt-1 text-red-900 text-sm font-medium">
                        {errors.email}
                      </p>
                    )}
                  </div>

                  <div>
                    <label htmlFor="phone" className="block text-gray-900 font-medium mb-1">
                      Phone Number <span aria-hidden="true">*</span>
                      <span className="sr-only">(required)</span>
                    </label>
                    <input
                      type="tel"
                      id="phone"
                      name="phone"
                      value={formData.phone}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      autoComplete="tel"
                      aria-required="true"
                      aria-invalid={errors.phone ? "true" : undefined}
                      aria-describedby={errors.phone ? "phone-error" : undefined}
                      className={`w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900 ${errors.phone ? 'border-red-700' : 'border-gray-500'}`}
                    />
                    {errors.phone && (
                      <p id="phone-error" className="mt-1 text-red-900 text-sm font-medium">
                        {errors.phone}
                      </p>
                    )}
                  </div>

                  <div>
                    <label htmlFor="company" className="block text-gray-900 font-medium mb-1">
                      Company
                      <span className="sr-only">(optional)</span>
                    </label>
                    <input
                      type="text"
                      id="company"
                      name="company"
                      value={formData.company}
                      onChange={handleChange}
                      autoComplete="organization"
                      className="w-full px-3 py-2 border border-gray-500 rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900"
                    />
                  </div>

                  <div>
                    <label htmlFor="department" className="block text-gray-900 font-medium mb-1">
                      Department <span aria-hidden="true">*</span>
                      <span className="sr-only">(required)</span>
                    </label>
                    <select
                      id="department"
                      name="department"
                      value={formData.department}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      aria-required="true"
                      aria-invalid={errors.department ? "true" : undefined}
                      aria-describedby={errors.department ? "department-error" : undefined}
                      className={`w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900 bg-white ${errors.department ? 'border-red-700' : 'border-gray-500'}`}
                    >
                      <option value="">Select a department...</option>
                      <option value="sales">Sales</option>
                      <option value="support">Customer Support</option>
                      <option value="billing">Billing</option>
                      <option value="technical">Technical Support</option>
                      <option value="general">General Inquiry</option>
                    </select>
                    {errors.department && (
                      <p id="department-error" className="mt-1 text-red-900 text-sm font-medium">
                        {errors.department}
                      </p>
                    )}
                  </div>

                  <div>
                    <label htmlFor="message" className="block text-gray-900 font-medium mb-1">
                      Message <span aria-hidden="true">*</span>
                      <span className="sr-only">(required)</span>
                    </label>
                    <textarea
                      id="message"
                      name="message"
                      value={formData.message}
                      onChange={handleChange}
                      onBlur={handleBlur}
                      rows="5"
                      aria-required="true"
                      aria-invalid={errors.message ? "true" : undefined}
                      aria-describedby={errors.message ? "message-error" : undefined}
                      className={`w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-gray-900 ${errors.message ? 'border-red-700' : 'border-gray-500'}`}
                    />
                    {errors.message && (
                      <p id="message-error" className="mt-1 text-red-900 text-sm font-medium">
                        {errors.message}
                      </p>
                    )}
                  </div>

                  <div className="flex items-start space-x-3 pt-2">
                    <div className="flex h-5 items-center">
                      <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        checked={formData.terms}
                        onChange={handleChange}
                        onBlur={handleBlur}
                        aria-required="true"
                        aria-invalid={errors.terms ? "true" : undefined}
                        aria-describedby={errors.terms ? "terms-error" : "terms-desc"}
                        className={`h-5 w-5 rounded focus:ring-2 focus:ring-blue-600 border-gray-500 ${errors.terms ? 'border-red-700' : ''}`}
                      />
                    </div>
                    <div className="text-sm">
                      <label htmlFor="terms" className="font-medium text-gray-900">
                        I agree to the terms and conditions <span aria-hidden="true">*</span>
                        <span className="sr-only">(required)</span>
                      </label>
                      <p id="terms-desc" className="text-gray-600 mt-1">
                        By checking this box, you agree to our <a href="#terms" className="text-blue-700 underline hover:text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded">Terms of Service</a> and <a href="#privacy" className="text-blue-700 underline hover:text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded">Privacy Policy</a>.
                      </p>
                      {errors.terms && (
                        <p id="terms-error" className="mt-1 text-red-900 font-medium">
                          {errors.terms}
                        </p>
                      )}
                    </div>
                  </div>
                </div>

                <div className="pt-6 border-t border-gray-300">
                  <button
                    type="submit"
                    className="w-full sm:w-auto bg-blue-700 text-white font-semibold px-8 py-3 rounded hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 transition-colors"
                  >
                    Submit Message
                  </button>
                </div>
              </form>
            )}
          </main>

          <footer className="bg-gray-100 border-t border-gray-300 mt-auto">
            <div className="max-w-4xl mx-auto px-4 py-6">
              <p className="text-gray-600 text-center">
                © 2024 Company Name. All rights reserved.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
