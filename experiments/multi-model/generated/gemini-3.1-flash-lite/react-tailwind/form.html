<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Accessible Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid #1e40af; outline-offset: 2px; }
    .error-border { border-color: #b91c1c !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:p-4 focus:bg-white focus:z-50">Skip to main content</a>
  
  <header class="p-6 bg-white border-b border-gray-300">
    <nav aria-label="Main navigation">
      <h1 class="text-xl font-bold">Company Portal</h1>
    </nav>
  </header>

  <main id="main-content" tabindex="-1" class="max-w-2xl mx-auto p-6">
    <div id="root"></div>
  </main>

  <footer class="p-6 text-center text-sm text-gray-600 border-t border-gray-300 mt-10">
    &copy; 2024 Accessible Services. All rights reserved.
  </footer>

  <script type="text/babel">
    function ContactForm() {
      const [formData, setFormData] = React.useState({ name: '', email: '', phone: '', company: '', subject: '', message: '', terms: false });
      const [errors, setErrors] = React.useState({});
      const [submitted, setSubmitted] = React.useState(false);
      const errorSummaryRef = React.useRef(null);

      const validate = () => {
        const newErrors = {};
        if (!formData.name) newErrors.name = "Full name is required";
        if (!formData.email || !formData.email.includes('@')) newErrors.email = "Valid email is required";
        if (!formData.terms) newErrors.terms = "You must agree to the terms";
        return newErrors;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate();
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          setTimeout(() => errorSummaryRef.current?.focus(), 100);
        } else {
          setErrors({});
          setSubmitted(true);
        }
      };

      if (submitted) return <div role="status" className="p-8 bg-green-50 border border-green-700 text-green-900"><h2>Thank you!</h2><p>Your message has been received.</p></div>;

      return (
        <form onSubmit={handleSubmit} noValidate className="space-y-6">
          {Object.keys(errors).length > 0 && (
            <div ref={errorSummaryRef} tabIndex="-1" role="alert" className="p-4 bg-red-50 border border-red-700">
              <h2 className="font-bold">Please correct the following errors:</h2>
              <ul className="list-disc pl-5">
                {Object.entries(errors).map(([key, msg]) => <li key={key}><a href={`#${key}`} className="underline">{msg}</a></li>)}
              </ul>
            </div>
          )}

          <fieldset className="space-y-4">
            <legend className="text-lg font-semibold">Contact Information</legend>
            
            <div>
              <label htmlFor="name" className="block font-medium">Full Name <span aria-hidden="true">*</span></label>
              <input type="text" id="name" name="name" required autoFocus className="w-full p-2 border border-gray-500 rounded"
                value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})}
                aria-invalid={!!errors.name} aria-describedby={errors.name ? "name-err" : undefined} />
              {errors.name && <p id="name-err" className="text-red-700 text-sm mt-1">{errors.name}</p>}
            </div>

            <div>
              <label htmlFor="email" className="block font-medium">Email <span aria-hidden="true">*</span></label>
              <input type="email" id="email" name="email" autoComplete="email" required className="w-full p-2 border border-gray-500 rounded"
                value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})}
                aria-invalid={!!errors.email} aria-describedby={errors.email ? "email-err" : undefined} />
              {errors.email && <p id="email-err" className="text-red-700 text-sm mt-1">{errors.email}</p>}
            </div>

            <div>
              <label htmlFor="subject" className="block font-medium">Department</label>
              <select id="subject" className="w-full p-2 border border-gray-500 rounded" onChange={e => setFormData({...formData, subject: e.target.value})}>
                <option value="">Select a department</option>
                <option value="sales">Sales</option>
                <option value="support">Support</option>
              </select>
            </div>

            <div>
              <label htmlFor="message" className="block font-medium">Message</label>
              <textarea id="message" rows="4" className="w-full p-2 border border-gray-500 rounded"
                value={formData.message} onChange={e => setFormData({...formData, message: e.target.value})}></textarea>
            </div>

            <div className="flex items-center gap-2">
              <input type="checkbox" id="terms" checked={formData.terms} className="w-5 h-5"
                onChange={e => setFormData({...formData, terms: e.target.checked})}
                aria-invalid={!!errors.terms} aria-describedby={errors.terms ? "terms-err" : undefined} />
              <label htmlFor="terms">I agree to the terms and conditions <span aria-hidden="true">*</span></label>
            </div>
            {errors.terms && <p id="terms-err" className="text-red-700 text-sm mt-1">{errors.terms}</p>}
          </fieldset>

          <button type="submit" className="px-6 py-3 bg-blue-800 text-white font-bold rounded hover:bg-blue-900 transition">Submit Request</button>
        </form>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ContactForm />);
  </script>
</body>
</html>
