<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudFlow — Team Collaboration Platform</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Screen reader only text */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus styles */
    :focus-visible {
      outline: 3px solid #1b2a4a;
      outline-offset: 2px;
    }

    /* Reduced motion respect */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Custom button styles */
    button {
      font-size: 1rem;
      line-height: 1.5;
    }

    /* Modal backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Modal dialog */
    .modal-dialog {
      background: white;
      border-radius: 0.5rem;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* Skip link visible on focus */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #1b2a4a;
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
      z-index: 100;
    }

    .skip-link:focus {
      top: 0;
    }

    /* Form field styling */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #1b2a4a;
      font-size: 1rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: #1b2a4a;
      background-color: #f9fafb;
    }

    .form-group input[aria-invalid="true"] {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    .error-message {
      color: #dc2626;
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }

    .hint-text {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    /* Toast region */
    #toast-region {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 50;
    }

    .toast {
      background: #10b981;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 0.375rem;
      margin-bottom: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      min-width: 300px;
      animation: slideIn 0.3s ease-out;
    }

    .toast-error {
      background: #dc2626;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Card styles */
    .feature-card {
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      padding: 1.5rem;
      transition: box-shadow 0.3s ease;
    }

    .feature-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    /* Testimonial styles */
    .testimonial {
      background: #f9fafb;
      border-left: 4px solid #1b2a4a;
      padding: 1.5rem;
      border-radius: 0.375rem;
    }

    /* Text readability */
    body {
      line-height: 1.6;
    }

    p, li {
      font-size: 1rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1rem;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    /* Placeholder contrast */
    input::placeholder {
      color: #9ca3af;
    }

    /* Link underlines */
    a {
      text-decoration: underline;
    }

    nav a {
      text-decoration: none;
    }

    nav a[aria-current="page"] {
      font-weight: 600;
      border-bottom: 2px solid #1b2a4a;
    }
  </style>
</head>
<body class="bg-white text-gray-900">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Toast region for notifications -->
  <div id="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Root React app -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Toast utility
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-region');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'error' ? 'toast-error' : ''}`;
      toast.textContent = message;
      toast.setAttribute('role', 'status');
      container.appendChild(toast);

      setTimeout(() => toast.remove(), 5000);
    }

    // SignUp Modal Component
    function SignupModal({ isOpen, onClose, triggerRef }) {
      const dialogRef = useRef(null);
      const emailRef = useRef(null);
      const [email, setEmail] = useState('');
      const [errors, setErrors] = useState({});

      useEffect(() => {
        if (isOpen && dialogRef.current) {
          setTimeout(() => emailRef.current?.focus(), 0);
        }
      }, [isOpen]);

      const validateEmail = (value) => {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(value) ? '' : 'Please enter a valid email address';
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const emailError = validateEmail(email);

        if (emailError) {
          setErrors({ email: emailError });
          return;
        }

        setErrors({});
        setEmail('');
        onClose();
        showToast(`Welcome! Check ${email} for setup instructions.`);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          onClose();
        }
      };

      if (!isOpen) return null;

      return (
        <div
          className="modal-backdrop"
          onClick={(e) => e.target === e.currentTarget && onClose()}
          onKeyDown={handleKeyDown}
        >
          <div
            className="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            ref={dialogRef}
          >
            <h2 id="modal-title" className="text-2xl font-bold mb-4">
              Get Started with CloudFlow
            </h2>
            <p className="text-gray-600 mb-6">
              Join thousands of teams already collaborating smarter. Get free access for 14 days.
            </p>

            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label htmlFor="signup-email">
                  Email Address <span aria-hidden="true">*</span>
                  <span className="sr-only">(required)</span>
                </label>
                <input
                  ref={emailRef}
                  type="email"
                  id="signup-email"
                  name="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="you@example.com"
                  autoComplete="email"
                  aria-required="true"
                  aria-invalid={!!errors.email}
                  aria-describedby={errors.email ? 'email-error' : 'email-hint'}
                />
                <p id="email-hint" className="hint-text">
                  We'll send a confirmation link to this address.
                </p>
                {errors.email && (
                  <p id="email-error" className="error-message" role="alert">
                    {errors.email}
                  </p>
                )}
              </div>

              <div className="flex gap-3">
                <button
                  type="submit"
                  className="flex-1 bg-blue-900 text-white px-4 py-2 rounded font-medium hover:bg-blue-800 transition-colors"
                >
                  Start Free Trial
                </button>
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 border-2 border-gray-300 text-gray-900 px-4 py-2 rounded font-medium hover:bg-gray-50 transition-colors"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [modalOpen, setModalOpen] = useState(false);
      const signupBtnRef = useRef(null);

      const openModal = () => setModalOpen(true);
      const closeModal = () => {
        setModalOpen(false);
        signupBtnRef.current?.focus();
      };

      return (
        <>
          {/* Skip link */}
          <a href="#main-content" className="skip-link">Skip to main content</a>

          {/* Header & Navigation */}
          <header className="bg-white border-b border-gray-200">
            <nav
              className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between"
              aria-label="Main navigation"
            >
              <h1 className="text-2xl font-bold text-blue-900">CloudFlow</h1>
              <ul className="flex gap-8 list-none">
                <li>
                  <a href="#features" className="text-gray-700 hover:text-blue-900">
                    Features
                  </a>
                </li>
                <li>
                  <a href="#testimonials" className="text-gray-700 hover:text-blue-900">
                    Testimonials
                  </a>
                </li>
                <li>
                  <a href="#pricing" className="text-gray-700 hover:text-blue-900">
                    Pricing
                  </a>
                </li>
              </ul>
              <button
                ref={signupBtnRef}
                onClick={openModal}
                aria-haspopup="dialog"
                className="bg-blue-900 text-white px-6 py-2 rounded font-medium hover:bg-blue-800 transition-colors"
              >
                Sign Up
              </button>
            </nav>
          </header>

          <main id="main-content">
            {/* Hero Section */}
            <section className="bg-gradient-to-br from-blue-50 to-indigo-50 py-20 px-4">
              <div className="max-w-7xl mx-auto text-center">
                <h1 className="text-5xl font-bold text-blue-900 mb-6">
                  Collaboration Made Simple
                </h1>
                <p className="text-xl text-gray-700 mb-8 max-w-2xl mx-auto">
                  CloudFlow brings your entire team together in one secure platform.
                  Organize projects, share files, and communicate—all in one place.
                </p>
                <button
                  onClick={openModal}
                  aria-haspopup="dialog"
                  className="bg-blue-900 text-white px-8 py-3 rounded-lg font-medium text-lg hover:bg-blue-800 transition-colors inline-block"
                >
                  Get Started Free
                </button>
                <p className="text-sm text-gray-600 mt-4">
                  No credit card required. 14-day free trial.
                </p>
              </div>
            </section>

            {/* Features Section */}
            <section id="features" className="py-20 px-4">
              <div className="max-w-7xl mx-auto">
                <h2 className="text-4xl font-bold text-center text-blue-900 mb-12">
                  Everything Your Team Needs
                </h2>

                <div className="grid md:grid-cols-3 gap-8">
                  {/* Feature 1 */}
                  <article className="feature-card">
                    <h3 className="text-xl font-semibold text-blue-900 mb-3">
                      <span aria-hidden="true">📁</span> File Management
                    </h3>
                    <p className="text-gray-700">
                      Upload, organize, and share files with granular permission controls.
                      Version history keeps track of every change.
                    </p>
                  </article>

                  {/* Feature 2 */}
                  <article className="feature-card">
                    <h3 className="text-xl font-semibold text-blue-900 mb-3">
                      <span aria-hidden="true">💬</span> Real-time Chat
                    </h3>
                    <p className="text-gray-700">
                      Instant messaging for teams and channels. Threaded conversations
                      keep discussions organized and searchable.
                    </p>
                  </article>

                  {/* Feature 3 */}
                  <article className="feature-card">
                    <h3 className="text-xl font-semibold text-blue-900 mb-3">
                      <span aria-hidden="true">📊</span> Project Tracking
                    </h3>
                    <p className="text-gray-700">
                      Kanban boards, Gantt charts, and timelines. Assign tasks, set
                      deadlines, and track progress in real time.
                    </p>
                  </article>
                </div>
              </div>
            </section>

            {/* Testimonials Section */}
            <section id="testimonials" className="bg-gray-50 py-20 px-4">
              <div className="max-w-7xl mx-auto">
                <h2 className="text-4xl font-bold text-center text-blue-900 mb-12">
                  Loved by Teams Worldwide
                </h2>

                <div className="grid md:grid-cols-2 gap-8">
                  {/* Testimonial 1 */}
                  <article className="testimonial">
                    <blockquote>
                      <p className="text-gray-800 mb-4">
                        "CloudFlow transformed how our distributed team works together.
                        We save hours every week on unnecessary meetings and emails."
                      </p>
                    </blockquote>
                    <p className="font-semibold text-blue-900">Sarah Chen</p>
                    <p className="text-sm text-gray-600">VP Product, TechVenture Inc</p>
                  </article>

                  {/* Testimonial 2 */}
                  <article className="testimonial">
                    <blockquote>
                      <p className="text-gray-800 mb-4">
                        "The interface is intuitive, the support is incredible, and the
                        price point is unbeatable. Highly recommend to any growing team."
                      </p>
                    </blockquote>
                    <p className="font-semibold text-blue-900">Marcus Williams</p>
                    <p className="text-sm text-gray-600">Founder, Creative Studio Co</p>
                  </article>
                </div>
              </div>
            </section>

            {/* CTA Section */}
            <section id="pricing" className="bg-blue-900 text-white py-20 px-4">
              <div className="max-w-4xl mx-auto text-center">
                <h2 className="text-4xl font-bold mb-6">
                  Ready to Transform How Your Team Works?
                </h2>
                <p className="text-xl mb-8 opacity-90">
                  Join 50,000+ teams using CloudFlow to collaborate smarter.
                </p>
                <button
                  onClick={openModal}
                  aria-haspopup="dialog"
                  className="bg-white text-blue-900 px-8 py-4 rounded-lg font-semibold text-lg hover:bg-gray-100 transition-colors"
                >
                  Start Your Free Trial Today
                </button>
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="bg-gray-900 text-white py-12 px-4">
            <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8 mb-8">
              <div>
                <h3 className="font-semibold mb-4">Product</h3>
                <ul className="space-y-2 list-none">
                  <li><a href="#" className="hover:text-blue-300">Features</a></li>
                  <li><a href="#" className="hover:text-blue-300">Pricing</a></li>
                  <li><a href="#" className="hover:text-blue-300">Security</a></li>
                </ul>
              </div>
              <div>
                <h3 className="font-semibold mb-4">Company</h3>
                <ul className="space-y-2 list-none">
                  <li><a href="#" className="hover:text-blue-300">About</a></li>
                  <li><a href="#" className="hover:text-blue-300">Blog</a></li>
                  <li><a href="#" className="hover:text-blue-300">Careers</a></li>
                </ul>
              </div>
              <div>
                <h3 className="font-semibold mb-4">Legal</h3>
                <ul className="space-y-2 list-none">
                  <li><a href="#" className="hover:text-blue-300">Privacy</a></li>
                  <li><a href="#" className="hover:text-blue-300">Terms</a></li>
                  <li><a href="#" className="hover:text-blue-300">Contact</a></li>
                </ul>
              </div>
              <div>
                <h3 className="font-semibold mb-4">Follow Us</h3>
                <ul className="space-y-2 list-none">
                  <li><a href="#" className="hover:text-blue-300">Twitter</a></li>
                  <li><a href="#" className="hover:text-blue-300">LinkedIn</a></li>
                  <li><a href="#" className="hover:text-blue-300">GitHub</a></li>
                </ul>
              </div>
            </div>

            <div className="border-t border-gray-700 pt-8 text-center text-gray-400">
              <p>&copy; 2026 CloudFlow. All rights reserved.</p>
            </div>
          </footer>

          {/* Signup Modal */}
          <SignupModal isOpen={modalOpen} onClose={closeModal} triggerRef={signupBtnRef} />
        </>
      );
    }

    // Render app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
