<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Acme Corp</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0;
            margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
            white-space: nowrap; border: 0;
        }
        :focus-visible {
            outline: 3px solid #1e40af;
            outline-offset: 2px;
        }
        html {
            scroll-padding-top: 80px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans leading-relaxed">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const FormPage = () => {
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                phone: '',
                company: '',
                department: '',
                message: '',
                terms: false
            });

            const [errors, setErrors] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const errorSummaryRef = useRef(null);

            const validate = () => {
                const newErrors = {};
                if (!formData.fullName.trim()) newErrors.fullName = 'Full name is required';
                if (!formData.email) {
                    newErrors.email = 'Email is required';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'Please enter a valid email address';
                }
                if (!formData.phone.trim()) newErrors.phone = 'Phone number is required';
                if (!formData.department) newErrors.department = 'Please select a department';
                if (formData.message.trim().length < 10) newErrors.message = 'Message must be at least 10 characters long';
                if (!formData.terms) newErrors.terms = 'You must accept the terms and conditions';
                
                return newErrors;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const validationErrors = validate();
                
                if (Object.keys(validationErrors).length > 0) {
                    setErrors(validationErrors);
                    // Focus error summary for screen readers
                    requestAnimationFrame(() => errorSummaryRef.current?.focus());
                    return;
                }

                setErrors({});
                setSubmitted(true);
                // Reset form
                setFormData({
                    fullName: '', email: '', phone: '', company: '', department: '', message: '', terms: false
                });
            };

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
                // Clear error when user starts typing
                if (errors[name]) {
                    setErrors(prev => {
                        const next = { ...prev };
                        delete next[name];
                        return next;
                    });
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-blue-600 focus:text-white focus:p-4 focus:rounded-md">
                        Skip to main content
                    </a>

                    <header className="bg-white border-b border-gray-200 sticky top-0 z-40">
                        <nav className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between" aria-label="Main navigation">
                            <div className="text-xl font-bold text-blue-700">Acme Corp</div>
                            <ul className="flex gap-6 text-sm font-medium">
                                <li><a href="/" className="text-gray-600 hover:text-blue-700 underline-offset-4 hover:underline">Home</a></li>
                                <li><a href="/about" className="text-gray-600 hover:text-blue-700 underline-offset-4 hover:underline">About</a></li>
                                <li><a href="/contact" className="text-blue-700 font-bold underline" aria-current="page">Contact</a></li>
                            </ul>
                        </nav>
                    </header>

                    <main id="main-content" className="flex-grow max-w-3xl mx-auto px-4 py-12 w-full" tabIndex="-1">
                        <header className="mb-8">
                            <h1 className="text-4xl font-extrabold tracking-tight text-gray-900 mb-4">Get in Touch</h1>
                            <p className="text-lg text-gray-600">Fill out the form below and our team will get back to you within 24 hours.</p>
                        </header>

                        {submitted && (
                            <div role="alert" className="mb-8 p-4 bg-green-50 border-l-4 border-green-600 text-green-800" tabIndex="-1">
                                <p className="font-bold">Success!</p>
                                <p>Your message has been sent successfully. We'll contact you soon.</p>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} noValidate className="bg-white shadow-sm border border-gray-200 rounded-xl p-6 md:p-8 space-y-6">
                            
                            {Object.keys(errors).length > 0 && (
                                <div 
                                    ref={errorSummaryRef} 
                                    tabIndex="-1" 
                                    role="alert" 
                                    className="p-4 bg-red-50 border border-red-200 rounded-md text-red-800"
                                >
                                    <h2 className="text-lg font-bold mb-2">There are {Object.keys(errors).length} errors in your submission:</h2>
                                    <ul className="list-disc pl-5 space-y-1">
                                        {Object.entries(errors).map(([field, msg]) => (
                                            <li key={field}>
                                                <a href={`#${field}`} className="underline hover:text-red-900">{msg}</a>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="flex flex-col">
                                    <label htmlFor="fullName" className="block text-sm font-semibold text-gray-700 mb-1">
                                        Full Name <span aria-hidden="true" className="text-red-600">*</span>
                                        <span className="sr-only"> (required)</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        id="fullName" 
                                        name="fullName" 
                                        autoComplete="name"
                                        value={formData.fullName}
                                        onChange={handleChange}
                                        aria-required="true"
                                        aria-invalid={!!errors.fullName}
                                        aria-describedby={errors.fullName ? "fullName-error" : undefined}
                                        className={`p-2 border rounded-md transition-colors ${errors.fullName ? 'border-red-600 bg-red-50' : 'border-gray-300'}`}
                                    />
                                    {errors.fullName && <p id="fullName-error" className="mt-1 text-sm text-red-600" role="alert">{errors.fullName}</p>}
                                </div>

                                <div className="flex flex-col">
                                    <label htmlFor="email" className="block text-sm font-semibold text-gray-700 mb-1">
                                        Email Address <span aria-hidden="true" className="text-red-600">*</span>
                                        <span className="sr-only"> (required)</span>
                                    </label>
                                    <input 
                                        type="email" 
                                        id="email" 
                                        name="email" 
                                        autoComplete="email"
                                        value={formData.email}
                                        onChange={handleChange}
                                        aria-required="true"
                                        aria-invalid={!!errors.email}
                                        aria-describedby={errors.email ? "email-error" : undefined}
                                        className={`p-2 border rounded-md transition-colors ${errors.email ? 'border-red-600 bg-red-50' : 'border-gray-300'}`}
                                    />
                                    {errors.email && <p id="email-error" className="mt-1 text-sm text-red-600" role="alert">{errors.email}</p>}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="flex flex-col">
                                    <label htmlFor="phone" className="block text-sm font-semibold text-gray-700 mb-1">
                                        Phone Number <span aria-hidden="true" className="text-red-600">*</span>
                                        <span className="sr-only"> (required)</span>
                                    </label>
                                    <input 
                                        type="tel" 
                                        id="phone" 
                                        name="phone" 
                                        autoComplete="tel"
                                        value={formData.phone}
                                        onChange={handleChange}
                                        aria-required="true"
                                        aria-invalid={!!errors.phone}
                                        aria-describedby={errors.phone ? "phone-error" : undefined}
                                        className={`p-2 border rounded-md transition-colors ${errors.phone ? 'border-red-600 bg-red-50' : 'border-gray-300'}`}
                                    />
                                    {errors.phone && <p id="phone-error" className="mt-1 text-sm text-red-600" role="alert">{errors.phone}</p>}
                                </div>

                                <div className="flex flex-col">
                                    <label htmlFor="company" className="block text-sm font-semibold text-gray-700 mb-1">
                                        Company
                                    </label>
                                    <input 
                                        type="text" 
                                        id="company" 
                                        name="company" 
                                        autoComplete="organization"
                                        value={formData.company}
                                        onChange={handleChange}
                                        className="p-2 border border-gray-300 rounded-md"
                                    />
                                </div>
                            </div>

                            <div className="flex flex-col">
                                <label htmlFor="department" className="block text-sm font-semibold text-gray-700 mb-1">
                                    Inquiry Department <span aria-hidden="true" className="text-red-600">*</span>
                                    <span className="sr-only"> (required)</span>
                                </label>
                                <select 
                                    id="department" 
                                    name="department" 
                                    value={formData.department}
                                    onChange={handleChange}
                                    aria-required="true"
                                    aria-invalid={!!errors.department}
                                    aria-describedby={errors.department ? "department-error" : undefined}
                                    className={`p-2 border rounded-md transition-colors ${errors.department ? 'border-red-600 bg-red-50' : 'border-gray-300'}`}
                                >
                                    <option value="">Select a department...</option>
                                    <option value="sales">Sales</option>
                                    <option value="support">Technical Support</option>
                                    <option value="billing">Billing</option>
                                    <option value="other">Other</option>
                                </select>
                                {errors.department && <p id="department-error" className="mt-1 text-sm text-red-600" role="alert">{errors.department}</p>}
                            </div>

                            <div className="flex flex-col">
                                <label htmlFor="message" className="block text-sm font-semibold text-gray-700 mb-1">
                                    Message <span aria-hidden="true" className="text-red-600">*</span>
                                    <span className="sr-only"> (required)</span>
                                </label>
                                <textarea 
                                    id="message" 
                                    name="message" 
                                    rows="5"
                                    value={formData.message}
                                    onChange={handleChange}
                                    aria-required="true"
                                    aria-invalid={!!errors.message}
                                    aria-describedby={errors.message ? "message-error" : "message-hint"}
                                    className={`p-2 border rounded-md transition-colors ${errors.message ? 'border-red-600 bg-red-50' : 'border-gray-300'}`}
                                ></textarea>
                                <p id="message-hint" className="mt-1 text-xs text-gray-500">Please describe your request in detail.</p>
                                {errors.message && <p id="message-error" className="mt-1 text-sm text-red-600" role="alert">{errors.message}</p>}
                            </div>

                            <div className="flex items-start gap-3">
                                <div className="flex items-center h-5">
                                    <input 
                                        id="terms" 
                                        name="terms" 
                                        type="checkbox" 
                                        checked={formData.terms}
                                        onChange={handleChange}
                                        aria-required="true"
                                        aria-invalid={!!errors.terms}
                                        aria-describedby={errors.terms ? "terms-error" : undefined}
                                        className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                    />
                                </div>
                                <div className="flex flex-col">
                                    <label htmlFor="terms" className="text-sm text-gray-700">
                                        I agree to the <a href="/terms" className="text-blue-700 underline hover:text-blue-800">Terms of Service</a> and <a href="/privacy" className="text-blue-700 underline hover:text-blue-800">Privacy Policy</a> <span aria-hidden="true" className="text-red-600">*</span>
                                    </label>
                                    {errors.terms && <p id="terms-error" className="mt-1 text-sm text-red-600" role="alert">{errors.terms}</p>}
                                </div>
                            </div>

                            <button 
                                type="submit" 
                                className="w-full md:w-auto px-8 py-3 bg-blue-700 text-white font-bold rounded-md hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 transition-all"
                            >
                                Submit Request
                            </button>
                        </form>
                    </main>

                    <footer className="bg-gray-100 border-t border-gray-200 py-8 mt-12">
                        <div className="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <p className="text-sm text-gray-600">&copy; 2024 Acme Corporation. All rights reserved.</p>
                            <ul className="flex gap-4 text-sm text-gray-600">
                                <li><a href="/privacy" className="hover:underline">Privacy Policy</a></li>
                                <li><a href="/terms" className="hover:underline">Terms of Service</a></li>
                                <li><a href="/accessibility" className="hover:underline">Accessibility Statement</a></li>
                            </ul>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FormPage />);
    </script>
</body>
</html>
