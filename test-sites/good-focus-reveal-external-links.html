<!-- WCAG-TEST
criterion: 3.2.1, 3.2.4
level: A
title: On Focus, Consistent Identification
test_type: good
expected_violations: 0
testable_by: regex
scanners: predictable-navigation
description: A skip link that moves into view on focus, and external links that are all identified the same way by carrying no indicator at all
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus reveal and external links</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        color: #1a1a1a;
        background: #fff;
      }
      main,
      header {
        padding: 1rem 2rem;
      }
      /* Parked off screen while unfocused, in the page flow when focused.
         Moving on focus is how the link is revealed, not a context change. */
      .skip-link {
        position: absolute;
        left: -9999px;
      }
      .skip-link:focus {
        position: static;
        left: auto;
        background: #ffdd00;
        padding: 0.75rem 1rem;
      }
      a:focus {
        outline: 3px solid #0b57d0;
        outline-offset: 2px;
      }
      li {
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header><strong>Reference library</strong></header>

    <main id="main-content">
      <h1>Focus reveal and external links</h1>
      <p>Further reading, all on other sites, all written the same way:</p>
      <ul>
        <li><a href="https://www.w3.org/TR/WCAG22/">Web Content Accessibility Guidelines 2.2</a></li>
        <li><a href="https://www.w3.org/WAI/ARIA/apg/">ARIA Authoring Practices Guide</a></li>
        <li><a href="https://html.spec.whatwg.org/">HTML Living Standard</a></li>
      </ul>
      <p>
        Questions go to <a href="mailto:library@example.org">library@example.org</a> or the
        <a href="/contact/">contact page</a>.
      </p>
    </main>
  </body>
</html>
