<!-- WCAG-TEST
criterion: 3.3.1, 3.3.2, 3.3.3
level: AA
title: Error Identification, Labels or Instructions, Error Suggestion
test_type: good
expected_violations: 0
testable_by: dom
scanners: error-handling
description: A login password with no policy, an e-mail and a date field with no format hint, aria-invalid="false", and groups named without a legend
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form fields without hints</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
        background: #fff;
        margin: 2rem;
      }
      .error-card {
        border: 1px solid #8b1a1a;
        color: #8b1a1a;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Form fields without hints</h1>

    <form action="/session" method="post">
      <h2>Sign in</h2>
      <p>
        <label for="user">User name</label>
        <input id="user" name="user" type="text" required aria-invalid="false" />
      </p>
      <p>
        <!-- A password that is checked, not created: there is no policy to state. -->
        <label for="pass">Password</label>
        <input id="pass" name="pass" type="password" required />
      </p>
      <button type="submit">Sign in</button>
    </form>

    <form action="/booking" method="post">
      <h2>Book an appointment</h2>
      <p>
        <label for="mail">E-mail address</label>
        <input id="mail" name="mail" type="email" required />
      </p>
      <p>
        <label for="day">Preferred day</label>
        <input id="day" name="day" type="date" required />
      </p>
      <p>
        <!-- The field is named by aria-label instead of a label element. -->
        <input type="text" name="reference" aria-label="Reference number" />
      </p>

      <h3 id="reach-title">How may we reach you</h3>
      <div role="radiogroup" aria-labelledby="reach-title">
        <p><label><input type="radio" name="reach" value="phone" checked /> By phone</label></p>
        <p><label><input type="radio" name="reach" value="mail" /> By e-mail</label></p>
      </div>

      <fieldset aria-label="Reminders">
        <p><label><input type="checkbox" name="remind" value="day" /> The day before</label></p>
        <p><label><input type="checkbox" name="remind" value="hour" /> An hour before</label></p>
      </fieldset>

      <button type="submit">Book</button>
    </form>

    <div class="error-card">
      <h2>Error rates in the sector</h2>
      <p>Our error rate dropped to 0.4 percent last year. This card is styled, not a message.</p>
    </div>
  </body>
</html>
