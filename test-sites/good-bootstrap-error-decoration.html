<!-- WCAG-TEST
criterion: 4.1.3
level: AA
title: Status Messages, Bootstrap error decoration and an empty error slot
test_type: good
expected_violations: 0
testable_by: dom
scanners: status-messages
description: A static .alert-danger box that is part of the page copy, an .invalid-feedback wrapper that only gains a class when the field is marked, and an empty container a field points at with aria-describedby on a page with no live region. None of them has shown a status message: the first two never change their text and the third is still empty, so nothing has failed 4.1.3 yet. The empty slot becomes a needs-review question instead of a violation, and missing-live-region must report nothing here.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap error decoration (GOOD)</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; color: #1b1b1b; background: #fff; }
  main { max-width: 800px; margin: 0 auto; padding: 24px; }
  .alert-danger { border: 1px solid #a4243b; background: #fdecee; color: #6b1220; padding: 12px 16px; }
  .invalid-feedback { color: #6b1220; display: none; }
  .invalid-feedback.is-shown { display: block; }
  label { display: block; margin-top: 12px; }
  input { font: inherit; border: 2px solid #4a4a4a; padding: 6px; width: 260px; }
  button { font: inherit; background: #0b4f6c; color: #fff; border: none; padding: 8px 14px; cursor: pointer; }
  :focus-visible { outline: 3px solid #0b4f6c; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Delivery address</h1>

  <div class="alert-danger">
    <strong>Note:</strong> parcels to the islands take two extra working days.
    This box is part of the page and never changes.
  </div>

  <form id="address">
    <label for="street">Street and number</label>
    <input type="text" id="street" name="street" required aria-describedby="street-error">
    <p class="error-text" id="street-error"></p>

    <label for="city">City</label>
    <input type="text" id="city" name="city" required>
    <div class="invalid-feedback" id="cityFeedback">Enter the city as it appears on the parcel label.</div>

    <p><button type="submit">Check address</button></p>
  </form>
</main>

<script>
  // Marking the field flips a class on a wrapper whose text was written into
  // the page by the author and never changes. No message appears.
  document.getElementById('address').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('cityFeedback').classList.add('is-shown');
  });
</script>
</body>
</html>
