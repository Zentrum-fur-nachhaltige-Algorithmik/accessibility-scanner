<!-- WCAG-TEST
criterion: 1.3.5
level: AA
title: Identify Input Purpose
test_type: good
expected_violations: 0
testable_by: browser
scanners: input-purpose
description: A book-title search, a job application asking for the position applied for, a language switcher, and a contact form whose phone and title fields carry a more precise token of the right family. None of these fields collects a datum about the user that the form does not already identify, so missing-autocomplete and wrong-autocomplete must stay silent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good: fields that are not the user's own data</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
  main { padding: 2rem; }
  fieldset { margin-bottom: 1.5rem; }
  label { display: block; margin: 0.5rem 0 0.25rem; }
</style>
</head>
<body>
<main>
  <h1>Library</h1>

  <form action="/search" method="get">
    <fieldset>
      <legend>Search the catalogue</legend>
      <label for="book-title">Title of the book</label>
      <input id="book-title" name="title" type="text">
      <label for="author">Author</label>
      <input id="author" name="author" type="text">
      <button type="submit">Search</button>
    </fieldset>
  </form>

  <form action="/apply" method="post">
    <fieldset>
      <legend>Apply for a job</legend>
      <label for="vacancy">Position applied for</label>
      <select id="vacancy" name="position">
        <option>Librarian</option>
        <option>Archivist</option>
      </select>
      <label for="motivation">Why this job?</label>
      <textarea id="motivation" name="motivation" rows="3"></textarea>
      <button type="submit">Apply</button>
    </fieldset>
  </form>

  <form action="/language" method="post">
    <label for="lang">Language</label>
    <select id="lang" name="language">
      <option>Deutsch</option>
      <option>English</option>
    </select>
    <button type="submit">Change</button>
  </form>

  <form action="/contact" method="post">
    <fieldset>
      <legend>Contact us</legend>
      <label for="given">First name</label>
      <input id="given" name="fname" type="text" autocomplete="given-name">
      <label for="family">Last name</label>
      <input id="family" name="lname" type="text" autocomplete="family-name">
      <label for="salutation">Titel</label>
      <input id="salutation" name="title" type="text" autocomplete="honorific-prefix">
      <label for="area">Phone, area code</label>
      <input id="area" name="phone_area" type="text" autocomplete="tel-area-code">
      <label for="local">Phone, local part</label>
      <input id="local" name="phone_local" type="text" autocomplete="tel-local-prefix">
      <button type="submit">Send</button>
    </fieldset>
  </form>
</main>
</body>
</html>
