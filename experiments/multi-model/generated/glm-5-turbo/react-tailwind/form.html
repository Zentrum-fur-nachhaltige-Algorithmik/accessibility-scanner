<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Acme Corp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html {
      scroll-padding-top: 72px;
    }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 16px;
      z-index: 100;
      padding: 8px 16px;
      background: #1e3a5f;
      color: #fff;
      font-weight: 700;
      border-radius: 0 0 8px 8px;
      text-decoration: none;
    }
    .skip-link:focus {
      top: 0;
    }

    *:focus-visible {
      outline: 3px solid #1b2a4a !important;
      outline-offset: 2px !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (forced-colors: active) {
      *:focus-visible {
        outline: 3px solid LinkText !important;
      }
      .icon-indicator {
        forced-color-adjust: auto;
      }
    }

    @media (prefers-contrast: more) {
      *:focus-visible {
        outline: 3px solid #000 !important;
        outline-offset: 2px !important;
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      return (
        <React.Fragment>
          <SkipLink />
          <Header />
          <main id="main-content" tabIndex={-1}>
            <ContactForm />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    function SkipLink() {
      return (
        <a href="#main-content" className="skip-link">Skip to main content</a>
      );
    }

    function Header() {
      return (
        <header className="bg-white border-b border-gray-500 sticky top-0 z-50">
          <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <span className="text-xl font-bold text-gray-900" aria-hidden="true">ACME</span>
            <nav aria-label="Main navigation">
              <ul className="flex gap-6 text-sm" role="list">
                <li>
                  <a href="/" className="text-gray-700 hover:text-gray-900 underline decoration-1 underline-offset-4 hover:decoration-2 focus-visible:underline">
                    Home
                  </a>
                </li>
                <li>
                  <a href="/about" className="text-gray-700 hover:text-gray-900 underline decoration-1 underline-offset-4 hover:decoration-2 focus-visible:underline">
                    About
                  </a>
                </li>
                <li>
                  <a href="/contact" aria-current="page" className="text-gray-900 font-semibold underline decoration-2 underline-offset-4">
                    Contact
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-gray-500 mt-12">
          <div className="max-w-3xl mx-auto px-4 py-6 text-center text-sm text-gray-600">
            <p>&copy; 2025 Acme Corp. All rights reserved.</p>
          </div>
        </footer>
      );
    }

    function ContactForm() {
      const emptyForm = {
        name: '',
        email: '',
        phone: '',
        company: '',
        department: '',
        message: '',
        terms: false
      };

      const [formData, setFormData] = useState(emptyForm);
      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const errorSummaryRef = useRef(null);
      const successRef = useRef(null);

      const errorCount = Object.keys(errors).length;
      const errorFieldIds = Object.keys(errors);

      function validate(data) {
        const errs = {};
        if (!data.name.trim()) errs.name = 'Full name is required';
        if (!data.email.trim()) {
          errs.email = 'Email address is required';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
          errs.email = 'Please enter a valid email address';
        }
        if (!data.phone.trim()) {
          errs.phone = 'Phone number is required';
        } else if (!/^[+\d\s()\-]{7,}$/.test(data.phone.replace(/\s/g, ''))) {
          errs.phone = 'Please enter a valid phone number';
        }
        if (!data.company.trim()) errs.company = 'Company name is required';
        if (!data.department) errs.department = 'Please select a department';
        if (!data.message.trim()) errs.message = 'Message is required';
        if (!data.terms) errs.terms = 'You must agree to the terms and conditions';
        return errs;
      }

      function handleChange(e) {
        const { name, value, type, checked } = e.target;
        const newValue = type === 'checkbox' ? checked : value;
        setFormData(prev => ({ ...prev, [name]: newValue }));
        if (errors[name]) {
          setErrors(prev => {
            const next = { ...prev };
            delete next[name];
            return next;
          });
        }
      }

      function handleSubmit(e) {
        e.preventDefault();
        const newErrors = validate(formData);

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          setSubmitted(false);
          requestAnimationFrame(() => {
            errorSummaryRef.current?.focus();
          });
          return;
        }

        setErrors({});
        setSubmitted(true);
        setFormData(emptyForm);
        requestAnimationFrame(() => {
          successRef.current?.focus();
        });
      }

      function fieldClass(fieldName) {
        const base = 'w-full px-3 py-2 rounded-md border text-gray-900 bg-white placeholder-gray-600 focus:ring-2';
        if (errors[fieldName]) {
          return base + ' border-red-700 focus:ring-red-600 focus:border-red-600';
        }
        return base + ' border-gray-500 focus:ring-blue-600 focus:border-blue-600';
      }

      function renderError(id, message) {
        if (!message) return null;
        return <p id={id} className="mt-1 text-sm text-red-800">{message}</p>;
      }

      const labelClass = 'block text-sm font-medium text-gray-900 mb-1';
      const req = (
        <React.Fragment>
          <span aria-hidden="true">*</span>
          <span className="sr-only"> (required)</span>
        </React.Fragment>
      );

      return (
        <div className="max-w-2xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
          <p className="text-gray-700 mb-8 max-w-prose">
            Fill out the form below and we will get back to you within one business day.
            Fields marked with an asterisk are required.
          </p>

          {submitted && (
            <div
              ref={successRef}
              tabIndex={-1}
              role="status"
              className="mb-6 p-4 rounded-md border border-green-700 bg-green-50 text-green-800"
            >
              <div className="flex items-center gap-2">
                <svg aria-hidden="true" className="w-5 h-5 icon-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                </svg>
                <span className="font-semibold">Thank you!</span>
              </div>
              <p className="mt-1">
                Your message has been sent successfully. We will respond within one business day.
              </p>
            </div>
          )}

          {errorCount > 0 && (
            <div
              ref={errorSummaryRef}
              tabIndex={-1}
              role="alert"
              className="mb-6 p-4 rounded-md border border-red-700 bg-red-50 text-red-800"
            >
              <h2 className="font-semibold flex items-center gap-2">
                <svg aria-hidden="true" className="w-5 h-5 icon-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                {errorCount} {errorCount === 1 ? 'error' : 'errors'} found
              </h2>
              <ul className="mt-2 list-disc list-inside">
                {errorFieldIds.map(field => (
                  <li key={field}>
                    <a href={`#${field}`} className="underline hover:no-underline focus-visible:underline">
                      {errors[field]}
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          )}

          <form onSubmit={handleSubmit} noValidate>
            <fieldset className="mb-6 border border-gray-500 rounded-md p-4 sm:p-6">
              <legend className="text-sm font-semibold text-gray-900 px-1">
                Personal Information
              </legend>
              <div className="space-y-4">
                <div>
                  <label htmlFor="name" className={labelClass}>
                    Full Name{req}
                  </label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    autoComplete="name"
                    value={formData.name}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={errors.name ? "true" : undefined}
                    aria-describedby={errors.name ? "name-error" : undefined}
                    className={fieldClass('name')}
                    placeholder="Jane Doe"
                  />
                  {renderError('name-error', errors.name)}
                </div>

                <div>
                  <label htmlFor="email" className={labelClass}>
                    Email Address{req}
                  </label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    autoComplete="email"
                    value={formData.email}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={errors.email ? "true" : undefined}
                    aria-describedby={errors.email ? "email-error" : undefined}
                    className={fieldClass('email')}
                    placeholder="jane@example.com"
                  />
                  {renderError('email-error', errors.email)}
                </div>

                <div>
                  <label htmlFor="phone" className={labelClass}>
                    Phone Number{req}
                  </label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autoComplete="tel"
                    value={formData.phone}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={errors.phone ? "true" : undefined}
                    aria-describedby={errors.phone ? "phone-error" : undefined}
                    className={fieldClass('phone')}
                    placeholder="(555) 123-4567"
                  />
                  {renderError('phone-error', errors.phone)}
                </div>
              </div>
            </fieldset>

            <fieldset className="mb-6 border border-gray-500 rounded-md p-4 sm:p-6">
              <legend className="text-sm font-semibold text-gray-900 px-1">
                Company Information
              </legend>
              <div className="space-y-4">
                <div>
                  <label htmlFor="company" className={labelClass}>
                    Company Name{req}
                  </label>
                  <input
                    type="text"
                    id="company"
                    name="company"
                    autoComplete="organization"
                    value={formData.company}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={errors.company ? "true" : undefined}
                    aria-describedby={errors.company ? "company-error" : undefined}
                    className={fieldClass('company')}
                    placeholder="Acme Corp"
                  />
                  {renderError('company-error', errors.company)}
                </div>

                <div>
                  <label htmlFor="department" className={labelClass}>
                    Department{req}
                  </label>
                  <select
                    id="department"
                    name="department"
                    value={formData.department}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={errors.department ? "true" : undefined}
                    aria-describedby={errors.department ? "department-error" : undefined}
                    className={fieldClass('department')}
                  >
                    <option value="">Select a department</option>
                    <option value="sales">Sales</option>
                    <option value="support">Customer Support</option>
                    <option value="engineering">Engineering</option>
                    <option value="partnerships">Partnerships</option>
                    <option value="hr">Human Resources</option>
                    <option value="other">Other</option>
                  </select>
                  {renderError('department-error', errors.department)}
                </div>
              </div>
            </fieldset>

            <div className="mb-6">
              <label htmlFor="message" className={labelClass}>
                Message{req}
              </label>
              <textarea
                id="message"
                name="message"
                rows={5}
                value={formData.message}
                onChange={handleChange}
                aria-required="true"
                aria-invalid={errors.message ? "true" : undefined}
                aria-describedby={errors.message ? "message-error" : undefined}
                className={fieldClass('message')}
                placeholder="Tell us how we can help you..."
              />
              {renderError('message-error', errors.message)}
            </div>

            <div className="mb-8">
              <div className="flex items-start gap-3">
                <input
                  type="checkbox"
                  id="terms"
                  name="terms"
                  checked={formData.terms}
                  onChange={handleChange}
                  aria-required="true"
                  aria-invalid={errors.terms ? "true" : undefined}
                  aria-describedby={errors.terms ? "terms-error" : undefined}
                  className="mt-0.5 w-6 h-6 rounded border-gray-500 text-blue-600 focus:ring-2 focus:ring-blue-600 cursor-pointer"
                />
                <label htmlFor="terms" className="text-sm text-gray-700 cursor-pointer">
                  I agree to the{' '}
                  <a href="/terms" className="underline text-gray-900 hover:no-underline focus-visible:underline">
                    Terms and Conditions
                  </a>
                  {' '}and{' '}
                  <a href="/privacy" className="underline text-gray-900 hover:no-underline focus-visible:underline">
                    Privacy Policy
                  </a>
                  {req}
                </label>
              </div>
              {errors.terms && (
                <p id="terms-error" className="mt-1 text-sm text-red-800 ml-9">{errors.terms}</p>
              )}
            </div>

            <button
              type="submit"
              className="w-full sm:w-auto px-8 py-3 bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white font-semibold rounded-md focus:ring-2 focus:ring-blue-600 focus:ring-offset-2"
            >
              Send Message
            </button>
          </form>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
