<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Missing Coverage Test Cases</title>
</head>
<body>
    <!-- Test case for duplicate-id-aria: IDs referenced by ARIA but duplicated -->
    <div id="shared-label">Shared Label Text</div>
    <div id="shared-label">Duplicate Label Text</div>
    
    <input type="text" aria-labelledby="shared-label">
    <select aria-describedby="shared-label"></select>
    
    <!-- Test case for page-has-heading-one: No H1 on page -->
    <h2>This page has no H1 heading</h2>
    <h3>Only H2 and lower</h3>
    
    <!-- Test case for form-field-label: Form controls with no labeling mechanism -->
    <form>
        <input type="text">
        <textarea></textarea>
        <select>
            <option>Option 1</option>
        </select>
    </form>
    
    <!-- Additional edge cases -->
    <button></button>
    <a href="#"></a>
    <iframe src="about:blank"></iframe>
</body>
</html>
