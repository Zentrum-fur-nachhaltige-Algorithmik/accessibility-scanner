<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — Get in Touch</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Screen reader only class */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus visible styles for keyboard navigation */
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid #1f2937;
      outline-offset: 2px;
    }

    /* Skip link styles */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #1f2937;
      color: white;
      padding: 8px;
      z-index: 100;
      text-decoration: underline;
    }

    .skip-link:focus {
      top: 0;
      outline: 3px solid #3b82f6;
      outline-offset: 2px;
    }

    /* Reduce motion support */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Required field indicator */
    .required-indicator {
      color: #dc2626;
      font-weight: bold;
    }

    /* Error message styling */
    .error-message {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.375rem;
    }

    /* Form field with error state */
    input[aria-invalid="true"],
    select[aria-invalid="true"],
    textarea[aria-invalid="true"] {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    /* Placeholder contrast */
    input::placeholder,
    textarea::placeholder,
    select::placeholder {
      color: #767676;
    }

    /* Success message */
    .success-message {
      background-color: #dcfce7;
      color: #166534;
      border: 2px solid #16a34a;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }

    /* Error summary styling */
    .error-summary {
      background-color: #fef2f2;
      border: 2px solid #dc2626;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .error-summary h2 {
      color: #991b1b;
      font-weight: bold;
      margin-bottom: 0.5rem;
      font-size: 1.125rem;
    }

    .error-summary ul {
      list-style: disc;
      padding-left: 1.5rem;
      margin: 0;
    }

    .error-summary li {
      margin-bottom: 0.375rem;
    }

    .error-summary a {
      color: #dc2626;
      text-decoration: underline;
    }

    .error-summary a:hover,
    .error-summary a:focus-visible {
      color: #991b1b;
    }
  </style>
</head>
<body class="bg-gray-50">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function ContactForm() {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        subject: '',
        message: '',
      });

      const [errors, setErrors] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const errorSummaryRef = useRef(null);

      // Validation function
      const validateForm = (data) => {
        const newErrors = {};

        if (!data.name.trim()) {
          newErrors.name = 'Name is required.';
        } else if (data.name.trim().length < 2) {
          newErrors.name = 'Name must be at least 2 characters long.';
        }

        if (!data.email.trim()) {
          newErrors.email = 'Email address is required.';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
          newErrors.email = 'Please enter a valid email address.';
        }

        if (data.phone && !/^[\d\s\-\+\(\)]+$/.test(data.phone)) {
          newErrors.phone = 'Please enter a valid phone number.';
        }

        if (!data.subject) {
          newErrors.subject = 'Please select a subject.';
        }

        if (!data.message.trim()) {
          newErrors.message = 'Message is required.';
        } else if (data.message.trim().length < 10) {
          newErrors.message = 'Message must be at least 10 characters long.';
        }

        return newErrors;
      };

      // Handle input changes
      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: value,
        }));
        // Clear error for this field when user starts typing
        if (errors[name]) {
          setErrors((prev) => ({
            ...prev,
            [name]: '',
          }));
        }
      };

      // Handle form submission
      const handleSubmit = (e) => {
        e.preventDefault();
        const newErrors = validateForm(formData);

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          // Focus error summary
          requestAnimationFrame(() => {
            errorSummaryRef.current?.focus();
          });
          return;
        }

        // Simulate form submission
        setIsSubmitting(true);
        setTimeout(() => {
          setSubmitted(true);
          setIsSubmitting(false);
          setFormData({
            name: '',
            email: '',
            phone: '',
            subject: '',
            message: '',
          });
          setErrors({});
          // Scroll to success message
          window.scrollTo(0, 0);
        }, 1000);
      };

      const hasErrors = Object.keys(errors).length > 0;

      return (
        <div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
          <div class="max-w-2xl mx-auto">
            {/* Skip Link - for keyboard navigation */}
            <a href="#contact-form" class="sr-only" tabindex="0">
              Skip to contact form
            </a>

            {/* Success Message */}
            {submitted && (
              <div
                class="success-message"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              >
                <h2 class="text-lg font-bold mb-1">Thank you for contacting us!</h2>
                <p>
                  We have received your message and will get back to you within 24 hours.
                </p>
              </div>
            )}

            <header class="mb-8">
              <h1 class="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
              <p class="text-gray-600">
                Have a question? We would love to hear from you. Send us a message
                and we will respond as soon as possible.
              </p>
            </header>

            <main id="main-content">
              {/* Error Summary */}
              {hasErrors && (
                <div
                  ref={errorSummaryRef}
                  tabindex="-1"
                  class="error-summary"
                  role="alert"
                  aria-live="assertive"
                  aria-atomic="true"
                >
                  <h2>Please correct the following {Object.keys(errors).length} error(s):</h2>
                  <ul>
                    {Object.entries(errors).map(([field, message]) => (
                      <li key={field}>
                        <a href={`#${field}`}>{message}</a>
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              <form
                id="contact-form"
                onSubmit={handleSubmit}
                novalidate
                class="bg-white shadow-md rounded-lg p-8"
              >
                {/* Name Field */}
                <div class="mb-6">
                  <label htmlFor="name" class="block text-sm font-medium text-gray-900 mb-1">
                    Name
                    <span class="required-indicator" aria-hidden="true">
                      *
                    </span>
                    <span class="sr-only">(required)</span>
                  </label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    value={formData.name}
                    onChange={handleChange}
                    autocomplete="name"
                    aria-required="true"
                    aria-invalid={!!errors.name}
                    aria-describedby={errors.name ? 'name-error' : undefined}
                    placeholder="John Doe"
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg text-gray-900 focus:border-blue-500"
                  />
                  {errors.name && (
                    <p id="name-error" class="error-message" role="alert">
                      {errors.name}
                    </p>
                  )}
                </div>

                {/* Email Field */}
                <div class="mb-6">
                  <label htmlFor="email" class="block text-sm font-medium text-gray-900 mb-1">
                    Email Address
                    <span class="required-indicator" aria-hidden="true">
                      *
                    </span>
                    <span class="sr-only">(required)</span>
                  </label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    value={formData.email}
                    onChange={handleChange}
                    autocomplete="email"
                    aria-required="true"
                    aria-invalid={!!errors.email}
                    aria-describedby={errors.email ? 'email-error' : 'email-hint'}
                    placeholder="john@example.com"
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg text-gray-900 focus:border-blue-500"
                  />
                  <p id="email-hint" class="text-xs text-gray-600 mt-1">
                    We will never share your email address.
                  </p>
                  {errors.email && (
                    <p id="email-error" class="error-message" role="alert">
                      {errors.email}
                    </p>
                  )}
                </div>

                {/* Phone Field */}
                <div class="mb-6">
                  <label htmlFor="phone" class="block text-sm font-medium text-gray-900 mb-1">
                    Phone Number
                    <span class="sr-only">(optional)</span>
                  </label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value={formData.phone}
                    onChange={handleChange}
                    autocomplete="tel"
                    aria-invalid={!!errors.phone}
                    aria-describedby={errors.phone ? 'phone-error' : 'phone-hint'}
                    placeholder="+1 (555) 123-4567"
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg text-gray-900 focus:border-blue-500"
                  />
                  <p id="phone-hint" class="text-xs text-gray-600 mt-1">
                    Include your area code and country code if calling from outside the US.
                  </p>
                  {errors.phone && (
                    <p id="phone-error" class="error-message" role="alert">
                      {errors.phone}
                    </p>
                  )}
                </div>

                {/* Subject Dropdown */}
                <div class="mb-6">
                  <label htmlFor="subject" class="block text-sm font-medium text-gray-900 mb-1">
                    Subject
                    <span class="required-indicator" aria-hidden="true">
                      *
                    </span>
                    <span class="sr-only">(required)</span>
                  </label>
                  <select
                    id="subject"
                    name="subject"
                    value={formData.subject}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={!!errors.subject}
                    aria-describedby={errors.subject ? 'subject-error' : undefined}
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg text-gray-900 focus:border-blue-500 bg-white"
                  >
                    <option value="">— Please select a subject —</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="sales">Sales Question</option>
                    <option value="partnership">Partnership Opportunity</option>
                    <option value="feedback">Feedback</option>
                  </select>
                  {errors.subject && (
                    <p id="subject-error" class="error-message" role="alert">
                      {errors.subject}
                    </p>
                  )}
                </div>

                {/* Message Textarea */}
                <div class="mb-8">
                  <label htmlFor="message" class="block text-sm font-medium text-gray-900 mb-1">
                    Message
                    <span class="required-indicator" aria-hidden="true">
                      *
                    </span>
                    <span class="sr-only">(required)</span>
                  </label>
                  <textarea
                    id="message"
                    name="message"
                    value={formData.message}
                    onChange={handleChange}
                    aria-required="true"
                    aria-invalid={!!errors.message}
                    aria-describedby={errors.message ? 'message-error' : 'message-hint'}
                    placeholder="Tell us more about your inquiry..."
                    rows="6"
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg text-gray-900 focus:border-blue-500 resize-vertical"
                  ></textarea>
                  <p id="message-hint" class="text-xs text-gray-600 mt-1">
                    Minimum 10 characters required.
                  </p>
                  {errors.message && (
                    <p id="message-error" class="error-message" role="alert">
                      {errors.message}
                    </p>
                  )}
                </div>

                {/* Submit Button */}
                <div class="flex gap-4">
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    aria-busy={isSubmitting}
                    class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 active:bg-blue-800 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                  >
                    {isSubmitting ? 'Sending...' : 'Send Message'}
                  </button>
                  <button
                    type="reset"
                    class="px-6 py-2 bg-gray-300 text-gray-900 font-medium rounded-lg hover:bg-gray-400 active:bg-gray-500 transition-colors"
                    aria-label="Clear form fields"
                  >
                    Clear
                  </button>
                </div>

                {/* Required fields note */}
                <p class="text-xs text-gray-600 mt-6">
                  <span class="required-indicator" aria-hidden="true">*</span>
                  <span class="sr-only">Asterisk indicates</span>
                  {' '}indicates required field
                </p>
              </form>
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ContactForm />);
  </script>
</body>
</html>
