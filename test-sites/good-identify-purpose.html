<!-- WCAG-TEST
criterion: 1.3.6
level: AAA
title: Identify Purpose
test_type: good
expected_violations: 0
testable_by: llm
scanners: llm-semantic-text-scanner
description: All UI components and regions have programmatically determinable purpose
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Identify Purpose - Company Site</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        .icon { display: inline-block; width: 24px; height: 24px; }
    </style>
</head>
<body>
    <!-- Pattern 1: Proper landmark roles -->
    <header role="banner">
        <h1>Company Name</h1>
        <nav role="navigation" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/contact">Contact Support</a>
        </nav>
    </header>

    <main role="main">
        <!-- Pattern 2: Icons with semantic purpose -->
        <section aria-labelledby="actions-heading">
            <h2 id="actions-heading">Document Actions</h2>
            <button aria-label="Save document">
                <svg class="icon" aria-hidden="true"><use href="#save-icon"/></svg>
                Save
            </button>
            <button aria-label="Delete document">
                <svg class="icon" aria-hidden="true"><use href="#delete-icon"/></svg>
                Delete
            </button>
            <button aria-label="Share document">
                <svg class="icon" aria-hidden="true"><use href="#share-icon"/></svg>
                Share
            </button>
        </section>

        <!-- Pattern 3: Form inputs with autocomplete and clear purpose -->
        <section aria-labelledby="form-heading">
            <h2 id="form-heading">Your Information</h2>
            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" autocomplete="name">
                <label for="email">Email Address</label>
                <input type="email" id="email" autocomplete="email">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" autocomplete="tel">
                <button type="submit">Submit Information</button>
            </form>
        </section>

        <!-- Pattern 4: Content sections with clear headings and landmarks -->
        <section aria-labelledby="news-heading">
            <h2 id="news-heading">Latest News</h2>
            <p>Updates from our team about upcoming events and product launches.</p>
        </section>

        <section aria-labelledby="reviews-heading">
            <h2 id="reviews-heading">Customer Reviews</h2>
            <p>Testimonials from satisfied users around the world.</p>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2024 Company Name. All rights reserved.</p>
    </footer>
</body>
</html>
