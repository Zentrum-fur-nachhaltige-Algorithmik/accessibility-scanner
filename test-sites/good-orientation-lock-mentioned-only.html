<!-- WCAG-TEST
criterion: 1.3.4
level: AA
title: Orientation
test_type: good
expected_violations: 0
testable_by: browser
scanners: orientation
description: The words screen.orientation.lock appear in a comment, in a feature test that is never taken, and in a JSON blob. Nothing calls the API, so orientation-lock-js must stay silent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good: the lock API named but never called</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
  main { padding: 2rem; }
</style>
</head>
<body>
<main>
  <h1>Presentation mode</h1>
  <p>The slides adapt to portrait and to landscape.</p>
  <button id="present" type="button">Start the presentation</button>
</main>
<script type="application/json" id="capabilities">
  { "api": "screen.orientation.lock", "used": false }
</script>
<script>
  // We deliberately do NOT call screen.orientation.lock('landscape') here:
  // the slides are readable in both orientations.
  var supportsLock = !!(screen.orientation && typeof screen.orientation.lock === 'function');

  document.getElementById('present').addEventListener('click', function () {
    if (supportsLock && false) {
      screen.orientation.lock('landscape');
    }
    document.body.setAttribute('data-presenting', 'true');
  });
</script>
</body>
</html>
