<!-- WCAG-TEST
criterion: 1.4.13
level: AA
title: Content on Hover or Focus
test_type: bad
expected_violations: 2
testable_by: regex
scanners: hover-focus-content
description: Controls whose only accessible name is a title attribute, so the name exists only in a browser tooltip that cannot be hovered or dismissed
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Names that live in a tooltip</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
        background: #fff;
      }
      .toolbar button,
      .toolbar a {
        font-size: 1.25rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #666;
        background: #fff;
        text-decoration: none;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Names that live in a tooltip</h1>

      <p class="toolbar">
        <!-- VIOLATION: the icon carries no text, so the name is the title -->
        <button type="button" title="Print this page">
          <span aria-hidden="true">&#128424;</span>
        </button>

        <!-- VIOLATION: an image link whose image has an empty alt -->
        <a href="/basket" title="Shopping basket">
          <img src="images/basket.svg" alt="" width="24" height="24" />
        </a>
      </p>
    </main>
  </body>
</html>
