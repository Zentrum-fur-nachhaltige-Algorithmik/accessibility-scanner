<!-- WCAG-TEST
criterion: 4.1.3
level: AA
title: Status Messages, progress that carries its own value
test_type: good
expected_violations: 0
testable_by: dom
scanners: status-messages
description: A native <progress value> counting an upload up and a role="progressbar" whose aria-valuenow and aria-valuetext are updated with it. Role plus property is exactly what 4.1.3 asks for: assistive technology reads the value without the page announcing it in a live region. The old rule reported both because their rendered value changed. missing-live-region must stay silent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress with a programmatic value (GOOD)</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; color: #1b1b1b; background: #fff; }
  main { max-width: 800px; margin: 0 auto; padding: 24px; }
  .bar { width: 320px; height: 16px; border: 1px solid #4a4a4a; }
  .bar > span { display: block; height: 100%; background: #0b4f6c; }
  progress { width: 320px; height: 16px; }
</style>
</head>
<body>
<main>
  <h1>Upload</h1>

  <h2>Native progress element</h2>
  <label for="upload">Uploading the report</label>
  <progress id="upload" value="10" max="100">10 percent</progress>

  <h2>Custom progress bar</h2>
  <div
    class="bar"
    id="customProgress"
    role="progressbar"
    aria-label="Converting the report"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="10"
    aria-valuetext="10 percent converted"
  >
    <span id="fill" style="width:10%"></span>
  </div>
</main>

<script>
  var value = 10;
  var native = document.getElementById('upload');
  var custom = document.getElementById('customProgress');
  var fill = document.getElementById('fill');

  setInterval(function () {
    value = value >= 100 ? 10 : value + 10;
    native.value = value;
    native.textContent = value + ' percent';
    custom.setAttribute('aria-valuenow', String(value));
    custom.setAttribute('aria-valuetext', value + ' percent converted');
    fill.style.width = value + '%';
  }, 150);
</script>
</body>
</html>
