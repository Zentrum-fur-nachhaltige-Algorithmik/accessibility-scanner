<!-- WCAG-TEST
criterion: 1.3.5
level: AA
title: Identify Input Purpose
test_type: good
expected_violations: 0
testable_by: regex
scanners: input-purpose
description: A URL to check, a city and country filter, a language switcher, a document title field and a contact preference radio group, none of which collect the user's own data
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check a page</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; color: #1a1a1a; background: #ffffff; }
        fieldset { margin: 1.5rem 0; }
        label { display: block; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <main>
        <h1>Check a page</h1>

        <!-- The address of somebody else's page, not the user's own -->
        <form action="/report" method="get">
            <label for="url">Web page address to check</label>
            <input type="text" id="url" name="url" placeholder="https://example.org">
            <button type="submit">Check</button>
        </form>

        <!-- A listing filter: city and country are the search, not the searcher -->
        <form action="/rooms" method="get">
            <h2>Find a room</h2>
            <label for="city">City</label>
            <select id="city" name="city">
                <option>Bremen</option>
                <option>Leipzig</option>
            </select>

            <label for="country">Country</label>
            <select id="country" name="country">
                <option>Germany</option>
                <option>Austria</option>
            </select>

            <label for="rooms">Rooms</label>
            <input type="number" id="rooms" name="rooms" min="1" max="4" value="1">
            <button type="submit">Search</button>
        </form>

        <!-- Site language, not the user's language preference record -->
        <form action="/language" method="post">
            <label for="language">Site language</label>
            <select id="language" name="language">
                <option>English</option>
                <option>Deutsch</option>
            </select>
            <button type="submit">Apply</button>
        </form>

        <!-- A document's title and organization, entered about a third party -->
        <form action="/records" method="post">
            <h2>Add a record</h2>
            <label for="doc-title">Title</label>
            <input type="text" id="doc-title" name="title">

            <label for="publisher">Organization</label>
            <input type="text" id="publisher" name="organization">
            <button type="submit">Save</button>
        </form>

        <!-- A preference, not a datum to autofill -->
        <form action="/preferences" method="post">
            <fieldset>
                <legend>Preferred contact method</legend>
                <label><input type="radio" name="contact" value="email"> Email</label>
                <label><input type="radio" name="contact" value="phone"> Phone</label>
            </fieldset>
            <button type="submit">Save</button>
        </form>

        <!-- Site search -->
        <form action="/search" method="get" role="search">
            <label for="q">Search the site</label>
            <input type="search" id="q" name="q">
            <button type="submit">Search</button>
        </form>
    </main>
</body>
</html>
