<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Acme Corp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Accessible base styles */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; top: -40px; left: 0;
      background: #1d4ed8; color: #fff; padding: 8px 16px;
      z-index: 100; text-decoration: none; font-weight: 600;
    }
    .skip-link:focus {
      top: 0;
    }
    /* Skip link and general focus */
    *:focus-visible {
      outline: 3px solid #1b2a4a;
      outline-offset: 2px;
    }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* Forced colors / Windows High Contrast */
    @media (forced-colors: active) {
      *:focus-visible {
        outline: 3px solid LinkText;
      }
      input, select, textarea {
        border: 1px solid ButtonText !important;
      }
      .error-border {
        border-color: #b91c1c !important;
      }
    }
    @media (prefers-contrast: more) {
      :root { --text-color: #000; --border-color: #000; --bg-color: #fff; }
    }
    /* Smooth scroll for anchor links */
    html {
      scroll-padding-top: 2px;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // Form validation logic
    const validateEmail = (val) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
    const validatePhone = (val) => {
      const cleaned = val.replace(/[\s\-().+]/g, '');
      return /^[\d]{7,15}$/.test(cleaned);
    };

    const validate = (data) => {
      const errors = {};

      if (!data.name.trim()) errors.name = 'Full name is required.';
      else if (data.name.trim().length < 2) errors.name = 'Name must be at least 2 characters.';

      if (!data.email.trim()) errors.email = 'Email address is required.';
      else if (!validateEmail(data.email)) errors.email = 'Please enter a valid email address.';

      if (!data.phone.trim()) errors.phone = 'Phone number is required.';
      else if (!validatePhone(data.phone)) errors.phone = 'Please enter a valid phone number (7-15 digits).';

      if (!data.company.trim()) errors.company = 'Company name is required.';

      if (!data.message.trim()) errors.message = 'Message is required.';
      else if (data.message.trim().length < 10) errors.message = 'Message must be at least 10 characters.';

      if (!data.department) errors.department = 'Please select a department.';

      if (!data.agreeTerms) errors.agreeTerms = 'You must agree to the terms before submitting.';

      return errors;
    };

    const DEPARTMENTS = [
      { value: '', label: '— Select a department —' },
      { value: 'sales', label: 'Sales' },
      { value: 'support', label: 'Support' },
      { value: 'billing', label: 'Billing' },
      { value: 'partnerships', label: 'Partnerships' },
      { value: 'careers', label: 'Careers' },
    ];

    function FormField({ id, label, error, children, hint, required, type = 'text' }) {
      const errorId = `${id}-error`;
      const hintId = `${id}-hint`;
      const hasError = !!error;

      const descId = hasError ? errorId : (hint ? hintId : undefined);

      return (
        <div className="mb-6">
          <div className="flex items-center gap-1 mb-1.5">
            <label htmlFor={id} className="block text-sm font-semibold text-gray-900">
              {label}
            </label>
            {required && (
              <>
                <span aria-hidden="true" className="text-red-700">*</span>
                <span className="sr-only">(required)</span>
              </>
            )}
          </div>
          {hint && (
            <p id={hintId} className="text-sm text-gray-600 mb-1.5">{hint}</p>
          )}
          {children(hasError, descId)}
          {hasError && (
            <p id={errorId} className="mt-1.5 text-sm text-red-800 font-medium" role="alert">
              <span aria-hidden="true">● </span>{error}
            </p>
          )}
        </div>
      );
    }

    function App() {
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        company: '',
        message: '',
        department: '',
        agreeTerms: false,
      });

      const [errors, setErrors] = useState({});
      const [touched, setTouched] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitResult, setSubmitResult] = useState(null);

      const errorSummaryRef = useRef(null);
      const formRef = useRef(null);
      const successRef = useRef(null);

      const handleChange = (e) => {
        const { id, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [id]: type === 'checkbox' ? checked : value
        }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setTouched(true);

        const validationErrors = validate(formData);
        const hasErrors = Object.keys(validationErrors).length > 0;
        setErrors(validationErrors);

        if (hasErrors) {
          setSubmitResult('error');
          // Focus error summary after state updates
          requestAnimationFrame(() => {
            errorSummaryRef.current?.focus();
          });
          return;
        }

        setIsSubmitting(true);
        setSubmitResult(null);

        // Simulate submission
        setTimeout(() => {
          setIsSubmitting(false);
          setSubmitted(true);
          setSubmitResult('success');
          // Focus success message
          requestAnimationFrame(() => {
            successRef.current?.focus();
          });
          // Reset after 10 seconds
          setTimeout(() => {
            setSubmitted(false);
            setSubmitResult(null);
            setFormData({
              name: '',
              email: '',
              phone: '',
              company: '',
              message: '',
              department: '',
              agreeTerms: false,
            });
            setTouched(false);
            setErrors({});
            formRef.current?.focus();
          }, 10000);
        }, 1500);
      };

      // Only show aria-invalid on touched fields
      const getFieldProps = (fieldId) => {
        const hasError = touched && errors[fieldId];
        return {
          'aria-invalid': hasError ? 'true' : undefined,
          ...(hasError && { 'aria-describedby': `${fieldId}-error` }),
        };
      };

      const renderInput = (id) => (hasError, descId) => (
        <div>
          {id === 'phone' ? (
            <>
              <input
                type="tel"
                id={id}
                name={id}
                value={formData[id]}
                onChange={handleChange}
                className={`w-full px-3 py-2 border ${hasError ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                placeholder="e.g. +1 (555) 123-4567"
                autoComplete="tel"
                aria-describedby={descId}
                aria-invalid={hasError ? 'true' : undefined}
              />
              {hasError && <span className="sr-only">{errors[id]}</span>}
            </>
          ) : (
            <>
              <input
                type={id === 'email' ? 'email' : (id === 'name' ? 'text' : 'text')}
                id={id}
                name={id}
                value={formData[id]}
                onChange={handleChange}
                className={`w-full px-3 py-2 border ${hasError ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                placeholder={id === 'email' ? 'you@example.com' : (id === 'name' ? '' : '')}
                autoComplete={id === 'email' ? 'email' : (id === 'name' ? 'name' : 'organization')}
                aria-describedby={descId}
                aria-invalid={hasError ? 'true' : undefined}
              />
              {hasError && <span className="sr-only">{errors[id]}</span>}
            </>
          )}
        </div>
      );

      // Success message
      if (submitted && submitResult === 'success') {
        return (
          <div className="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div
              ref={successRef}
              tabIndex={-1}
              role="alert"
              className="bg-green-50 border-2 border-green-700 rounded-lg p-6 mb-8 focus:outline-none"
            >
              <div className="flex items-start gap-3">
                <span aria-hidden="true" className="text-2xl">✓</span>
                <div>
                  <h2 className="text-xl font-bold text-green-900 mb-2">Thank you for reaching out!</h2>
                  <p className="text-green-800 mb-2">
                    Your message has been submitted successfully. We'll respond to your inquiry within 2 business days.
                  </p>
                  <p className="text-green-700 text-sm">
                    Form will reset in 10 seconds.
                  </p>
                </div>
              </div>
            </div>
            <a
              href="#main-content"
              className="text-blue-700 hover:text-blue-900 font-medium underline focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-2 py-1"
            >
              Return to top of form
            </a>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
          <h1 className="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
          <p className="text-gray-700 mb-8 max-w-xl">
            Have a question or need assistance? Fill out the form below and our team will get back to you promptly. Fields marked with <span aria-hidden="true">*</span> are required.
          </p>

          {/* Error Summary — only shown when validation fails */}
          {touched && Object.keys(errors).length > 0 && (
            <div
              ref={errorSummaryRef}
              tabIndex={-1}
              role="alert"
              className="bg-red-50 border-2 border-red-700 rounded-lg p-4 mb-8 focus:outline-none"
            >
              <h2 className="text-lg font-bold text-red-900 mb-2">
                Please fix {Object.keys(errors).length} error{Object.keys(errors).length > 1 ? 's' : ''} before submitting:
              </h2>
              <ul className="list-disc list-inside space-y-1">
                {Object.entries(errors).map(([field, msg]) => (
                  <li key={field}>
                    <a
                      href={`#${field}`}
                      className="text-red-800 underline hover:text-red-900 focus:outline-none focus:ring-2 focus:ring-red-600 rounded px-1"
                      onClick={(e) => {
                        e.preventDefault();
                        const target = document.getElementById(field);
                        if (target) {
                          target.focus();
                          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                      }}
                    >
                      {msg}
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          )}

          {/* Submitting indicator */}
          {isSubmitting && (
            <div role="status" aria-live="polite" className="sr-only">
              Submitting your form, please wait.
            </div>
          )}

          <form ref={formRef} onSubmit={handleSubmit} noValidate id="contact-form">
            {/* Personal Information Group */}
            <fieldset className="mb-4 border-0 p-0">
              <legend className="text-xl font-bold text-gray-900 mb-4 border-b-2 border-gray-700 pb-1">
                Personal Information
              </legend>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="name" className="block text-sm font-semibold text-gray-900">
                    Full Name
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <input
                  type="text"
                  id="name"
                  name="name"
                  value={formData.name}
                  onChange={handleChange}
                  className={`w-full px-3 py-2 border ${touched && errors.name ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                  placeholder="e.g. Jane Smith"
                  autoComplete="name"
                  aria-required="true"
                  aria-invalid={touched && errors.name ? 'true' : undefined}
                  aria-describedby={touched && errors.name ? 'name-error' : undefined}
                />
                {touched && errors.name && (
                  <p id="name-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.name}
                  </p>
                )}
              </div>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="email" className="block text-sm font-semibold text-gray-900">
                    Email Address
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <input
                  type="email"
                  id="email"
                  name="email"
                  value={formData.email}
                  onChange={handleChange}
                  className={`w-full px-3 py-2 border ${touched && errors.email ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                  placeholder="you@example.com"
                  autoComplete="email"
                  aria-required="true"
                  aria-invalid={touched && errors.email ? 'true' : undefined}
                  aria-describedby={touched && errors.email ? 'email-error' : undefined}
                />
                {touched && errors.email && (
                  <p id="email-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.email}
                  </p>
                )}
              </div>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="phone" className="block text-sm font-semibold text-gray-900">
                    Phone Number
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <p id="phone-hint" className="text-sm text-gray-600 mb-1.5">
                  We'll never share your phone number.
                </p>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  value={formData.phone}
                  onChange={handleChange}
                  className={`w-full px-3 py-2 border ${touched && errors.phone ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                  placeholder="e.g. +1 (555) 123-4567"
                  autoComplete="tel"
                  aria-required="true"
                  aria-invalid={touched && errors.phone ? 'true' : undefined}
                  aria-describedby={touched && errors.phone ? `${phone-hint} phone-error` : 'phone-hint'}
                />
                {touched && errors.phone && (
                  <p id="phone-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.phone}
                  </p>
                )}
              </div>
            </fieldset>

            {/* Organization Group */}
            <fieldset className="mb-4 border-0 p-0">
              <legend className="text-xl font-bold text-gray-900 mb-4 border-b-2 border-gray-700 pb-1">
                Organization
              </legend>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="company" className="block text-sm font-semibold text-gray-900">
                    Company
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <input
                  type="text"
                  id="company"
                  name="company"
                  value={formData.company}
                  onChange={handleChange}
                  className={`w-full px-3 py-2 border ${touched && errors.company ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                  placeholder="Your company name"
                  autoComplete="organization"
                  aria-required="true"
                  aria-invalid={touched && errors.company ? 'true' : undefined}
                  aria-describedby={touched && errors.company ? 'company-error' : undefined}
                />
                {touched && errors.company && (
                  <p id="company-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.company}
                  </p>
                )}
              </div>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="department" className="block text-sm font-semibold text-gray-900">
                    Department
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <select
                  id="department"
                  name="department"
                  value={formData.department}
                  onChange={handleChange}
                  className={`w-full px-3 py-2 border ${touched && errors.department ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition`}
                  aria-required="true"
                  aria-invalid={touched && errors.department ? 'true' : undefined}
                  aria-describedby={touched && errors.department ? 'department-error' : undefined}
                >
                  {DEPARTMENTS.map((dept) => (
                    <option key={dept.value} value={dept.value} disabled={dept.value === ''}>
                      {dept.label}
                    </option>
                  ))}
                </select>
                {touched && errors.department && (
                  <p id="department-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.department}
                  </p>
                )}
              </div>
            </fieldset>

            {/* Message */}
            <fieldset className="mb-4 border-0 p-0">
              <legend className="text-xl font-bold text-gray-900 mb-4 border-b-2 border-gray-700 pb-1">
                Your Message
              </legend>

              <div className="mb-6">
                <div className="flex items-center gap-1 mb-1.5">
                  <label htmlFor="message" className="block text-sm font-semibold text-gray-900">
                    Message
                  </label>
                  <span aria-hidden="true" className="text-red-700">*</span>
                  <span className="sr-only">(required)</span>
                </div>
                <textarea
                  id="message"
                  name="message"
                  value={formData.message}
                  onChange={handleChange}
                  rows="5"
                  className={`w-full px-3 py-2 border ${touched && errors.message ? 'border-red-700 bg-red-50' : 'border-gray-500'} rounded-md text-gray-900 placeholder:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent resize-y transition`}
                  placeholder="Please describe your inquiry..."
                  aria-required="true"
                  aria-invalid={touched && errors.message ? 'true' : undefined}
                  aria-describedby={touched && errors.message ? 'message-error' : undefined}
                />
                {touched && errors.message && (
                  <p id="message-error" className="mt-1.5 text-sm text-red-800 font-medium">
                    <span aria-hidden="true">● </span>{errors.message}
                  </p>
                )}
              </div>
            </fieldset>

            {/* Terms Checkbox */}
            <div className="mb-6">
              <div className="flex items-start gap-2">
                <input
                  type="checkbox"
                  id="agreeTerms"
                  name="agreeTerms"
                  checked={formData.agreeTerms}
                  onChange={handleChange}
                  className="mt-1 h-4 w-4 rounded border-gray-500 text-blue-600 focus:ring-blue-600 cursor-pointer"
                  aria-required="true"
                  aria-invalid={touched && errors.agreeTerms ? 'true' : undefined}
                  aria-describedby={touched && errors.agreeTerms ? 'terms-error' : undefined}
                />
                <label htmlFor="agreeTerms" className="mt-0.5 text-sm text-gray-900 cursor-pointer">
                  I agree to the <a href="#" className="text-blue-700 hover:text-blue-900 underline focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-1">Privacy Policy</a> <span aria-hidden="true">*</span>
                  <span className="sr-only">(required)</span>
                </label>
              </div>
              {touched && errors.agreeTerms && (
                <p id="terms-error" className="mt-1.5 text-sm text-red-800 font-medium" role="alert">
                  <span aria-hidden="true">● </span>{errors.agreeTerms}
                </p>
              )}
            </div>

            {/* Submit Button */}
            <div className="flex items-center gap-4">
              <button
                type="submit"
                disabled={isSubmitting}
                className="px-6 py-2.5 bg-blue-700 text-white font-semibold rounded-md hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 disabled:opacity-60 disabled:cursor-not-allowed transition min-h-[44px] focus:ring-offset-2"
                style={{ minWidth: '44px', minHeight: '44px' }}
              >
                {isSubmitting ? (
                  <span className="flex items-center gap-2">
                    <svg className="animate-spin h-5 w-5 text-white" aria-hidden="true" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Submitting…
                  </span>
                ) : (
                  'Submit Form'
                )}
              </button>

              <button
                type="reset"
                className="px-4 py-2.5 text-gray-700 font-medium hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded disabled:opacity-60 border border-gray-500 hover:border-gray-700 transition min-h-[44px]"
                style={{ minWidth: '44px', minHeight: '44px' }}
                onClick={() => {
                  setFormData({
                    name: '',
                    email: '',
                    phone: '',
                    company: '',
                    message: '',
                    department: '',
                    agreeTerms: false,
                  });
                  setTouched(false);
                  setErrors({});
                  setSubmitResult(null);
                }}
              >
                Clear Form
              </button>
            </div>
          </form>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
