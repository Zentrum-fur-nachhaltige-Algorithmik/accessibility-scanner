<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Form with status message</title></head>
<body>
  <header><h1>Contact form (announces its result)</h1></header>
  <main>
    <form id="form">
      <label for="msg">Your message</label>
      <input id="msg" name="msg" type="text">
      <button id="send" type="submit">Send message</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('status').textContent = 'Thank you, your message was sent.';
    });
  </script>
</body>
</html>
