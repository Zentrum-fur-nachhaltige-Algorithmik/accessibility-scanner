<!-- WCAG-TEST
criterion: 1.1.1, 1.2.1, 1.2.2
level: A
title: Icons, photographs and a decorative background video
test_type: good
expected_violations: 0
testable_by: dom
scanners: media-accessibility
description: Inline SVG icons inside named controls, a photograph with a long descriptive alt, a 24px chart icon, an object and an image map with their own names, a decorative canvas, a muted looping background video with no player, plus a captioned video and an audio element with a transcript. Every one of these was reported as a defect.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icons, photographs and a background video</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 1rem; }
  .hero { position: relative; height: 180px; overflow: hidden; }
  .hero video { width: 100%; height: 180px; object-fit: cover; }
  .icon { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="hero">
  <video autoplay loop muted playsinline poster="hero-still.jpg">
    <source src="hero-loop.mp4" type="video/mp4">
  </video>
</div>

<h1>Our practice</h1>

<button type="button">
  <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8"></circle></svg>
  Search
</button>

<a href="#contact">
  <svg class="icon" viewBox="0 0 20 20"><path d="M2 2h16v16H2z"></path></svg>
  Contact us
</a>

<img src="team-2026.jpg" width="640" height="360"
     alt="The eleven members of the practice team standing in the waiting room in front of the reception desk, all wearing green uniforms, on the morning of the anniversary celebration.">

<img src="chart-icon.png" width="24" height="24" alt="Statistics">

<object data="floorplan.svg" width="300" height="200" title="Floor plan of the ground floor"></object>

<img src="floorplan.png" width="300" height="200" alt="Floor plan" usemap="#plan">
<map name="plan">
  <area shape="rect" coords="0,0,100,100" href="#reception" alt="Reception">
  <area shape="rect" coords="100,0,200,100" href="#lab" alt="Laboratory">
</map>

<canvas width="30" height="30"></canvas>
<canvas width="400" height="200" aria-hidden="true"></canvas>

<iframe src="tour.html" width="320" height="180" title="Video tour of the practice"></iframe>

<input type="image" src="submit.png" alt="Submit">

<section>
  <h2>Practice tour</h2>
  <video controls width="640" aria-label="Practice tour">
    <source src="tour.mp4" type="video/mp4">
    <track kind="captions" src="tour-en.vtt" srclang="en" label="English" default>
  </video>
</section>

<section>
  <h2>Podcast episode 4</h2>
  <audio controls aria-describedby="episode-transcript">
    <source src="episode-4.mp3" type="audio/mpeg">
  </audio>
  <div id="episode-transcript" class="transcript">
    <h3>Transcript</h3>
    <p>Welcome to episode four. Today we talk about how the practice prepares for the European
      Accessibility Act, what changed in the appointment booking and which barriers patients
      reported to us over the last year.</p>
  </div>
</section>
</body>
</html>
