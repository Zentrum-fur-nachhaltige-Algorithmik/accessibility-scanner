<!-- WCAG-TEST
criterion: 1.3.5
level: AA
title: Identify Input Purpose
test_type: good
expected_violations: 0
testable_by: dom
scanners: input-purpose
description: A language switcher and a country filter that belong to no form, on a page that also has a contact form with an e-mail field. Neither control collects data about the user, so autocomplete="off" on them is not a 1.3.5 failure.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Language switcher - Accessibility Test</title>
  </head>
  <body>
    <header>
      <label for="site-language">Language</label>
      <select id="site-language" name="language" autocomplete="off">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
      </select>

      <label for="office-country">Office</label>
      <select id="office-country" name="country" autocomplete="off">
        <option value="at">Austria</option>
        <option value="ch">Switzerland</option>
      </select>
    </header>

    <main>
      <h1>Contact</h1>
      <form action="/contact" method="post">
        <p>
          <label for="contact-name">Your name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" />
        </p>
        <p>
          <label for="contact-email">Your e-mail address</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" />
        </p>
        <p><button type="submit">Send</button></p>
      </form>
    </main>
  </body>
</html>
