<!-- WCAG-TEST
criterion: 1.1.1
level: A
title: Non-text Content
test_type: good
expected_violations: 0
testable_by: browser
scanners: media-accessibility
description: An icon whose filename alt sits inside a button its author named, a photograph in a figure whose caption is not about data, a chart in a figure whose caption says so, and an image whose role and alt contradict each other. Only the last two raise a question; neither is a proven failure.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good: images that need a judgement, not a verdict</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
  main { padding: 2rem; }
  figure { margin: 0 0 2rem; }
</style>
</head>
<body>
<main>
  <h1>Gallery</h1>

  <button type="button" aria-label="Print this page">
    <img src="printer-icon.png" alt="printer-icon.png" width="24" height="24">
  </button>

  <figure>
    <img id="photo" src="hall.jpg" alt="The assembly hall seen from the gallery" width="420" height="320">
    <figcaption>The assembly hall, photographed in June.</figcaption>
  </figure>

  <figure>
    <img id="chart" src="q3.png" alt="Sales" width="420" height="320">
    <figcaption>Chart: sales per region in the third quarter.</figcaption>
  </figure>

  <img id="contradiction" src="divider.png" role="presentation" alt="A decorative divider" width="300" height="8">
</main>
</body>
</html>
