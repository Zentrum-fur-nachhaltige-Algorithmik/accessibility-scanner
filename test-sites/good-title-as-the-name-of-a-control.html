<!-- WCAG-TEST
criterion: 1.4.13
level: AA
title: A control named by its title attribute is a naming question, not hover content
test_type: good
expected_violations: 0
testable_by: dom
scanners: hover-focus-content
description: The teaser link takes its whole accessible name from a title attribute, and the bookmark button carries both a title and its own text. SC 1.4.13 governs additional content the author shows on hover or focus; the tooltip a browser draws from title is user agent content the author can neither make hoverable nor dismiss, and a control with no name at all is SC 4.1.2, which the axe rules link-name and button-name measure. Nothing here appears on hover.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teasers</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #ffffff; color: #1a1a1a; }
  main { max-width: 44rem; margin: 0 auto; padding: 1rem; }
  .teaser { display: block; border: 1px solid #595959; padding: 1rem; }
  .teaser video { width: 100%; height: 6rem; background: #333333; }
  button { background: #0b4f9e; color: #ffffff; border: none; padding: .5rem 1rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Teasers</h1>

  <a class="teaser" href="/article" title="Two years after the flood: what the village rebuilt">
    <video autoplay loop playsinline src="teaser.mp4"></video>
  </a>

  <button type="button" title="Add to reading list">Add to reading list</button>
</main>
</body>
</html>
