<!-- WCAG-TEST
criterion: 1.3.1, 3.3.2
level: A
title: Unnamed radio group and a pattern field that states no format
test_type: bad
expected_violations: 3
testable_by: dom
scanners: error-handling
description: Two same-name radios with no fieldset and no heading above them, a fieldset with no legend, and a field with a pattern attribute and no description of the format. The radio group is reported on the group itself, never on the form around it, and the page carries a correctly named fieldset elsewhere that must stay silent.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>
<style>
  body { font-family: system-ui, Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 1rem; line-height: 1.5; }
  fieldset { margin: 1rem 0; border: 1px solid #767676; }
  label { display: block; margin-top: .5rem; }
  :focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Order</h1>

  <form action="/order" method="post">
    <p>Choose how the order should reach you and how you want to pay.</p>

    <!-- VIOLATION (1.3.1): a radio group with no fieldset, no role=group and
         no heading above it. The group is the offender, not the form. -->
    <label><input type="radio" name="delivery" value="post"> By post</label>
    <label><input type="radio" name="delivery" value="pickup"> Pick up in store</label>

    <!-- VIOLATION (1.3.1): a fieldset that carries no legend. -->
    <fieldset>
      <label><input type="checkbox" name="extras" value="gift"> Gift wrapping</label>
      <label><input type="checkbox" name="extras" value="card"> Greeting card</label>
    </fieldset>

    <!-- Correctly named group: must stay silent. -->
    <fieldset>
      <legend>Payment</legend>
      <label><input type="radio" name="payment" value="card"> Card</label>
      <label><input type="radio" name="payment" value="invoice"> Invoice</label>
    </fieldset>

    <!-- VIOLATION (3.3.2): a pattern with no statement of the format. -->
    <label for="zip">Postcode</label>
    <input id="zip" name="zip" type="text" pattern="[0-9]{5}">

    <button type="submit">Order</button>
  </form>
</main>
</body>
</html>
