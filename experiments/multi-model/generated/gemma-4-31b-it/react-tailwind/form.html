<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Accessibility First Co.</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        :focus-visible {
            outline: 3px solid #2563eb !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans leading-relaxed">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                phone: '',
                company: '',
                subject: '',
                message: '',
                terms: false
            });

            const [errors, setErrors] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const errorSummaryRef = useRef(null);

            const validate = () => {
                const newErrors = {};
                if (!formData.fullName.trim()) newErrors.fullName = 'Full name is required';
                if (!formData.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
                    newErrors.email = 'Please enter a valid email address';
                }
                if (!formData.phone.trim()) newErrors.phone = 'Phone number is required';
                if (!formData.subject) newErrors.subject = 'Please select a subject';
                if (!formData.message.trim() || formData.message.length < 10) {
                    newErrors.message = 'Message must be at least 10 characters long';
                }
                if (!formData.terms) newErrors.terms = 'You must accept the terms and conditions';
                
                return newErrors;
            };

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const validationErrors = validate();
                
                if (Object.keys(validationErrors).length > 0) {
                    setErrors(validationErrors);
                    // Focus the error summary for screen readers
                    requestAnimationFrame(() => {
                        errorSummaryRef.current?.focus();
                    });
                    return;
                }

                setErrors({});
                setIsSubmitted(true);
                // In a real app, you would perform an API call here
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:p-4 focus:bg-blue-600 focus:text-white focus:z-50">
                        Skip to main content
                    </a>

                    <header className="bg-white border-b border-gray-500 p-4">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="text-xl font-bold text-blue-800">Accessibility First Co.</div>
                            <nav aria-label="Main navigation">
                                <ul className="flex gap-4">
                                    <li><a href="/" className="text-blue-700 underline hover:text-blue-900 font-medium">Home</a></li>
                                    <li><a href="/about" className="text-blue-700 underline hover:text-blue-900 font-medium">About</a></li>
                                </ul>
                            </nav>
                        </div>
                    </header>

                    <main id="main-content" tabIndex="-1" className="flex-grow p-6 md:p-12">
                        <div className="max-w-2xl mx-auto">
                            <h1 className="text-3xl font-extrabold mb-2 text-gray-900">Contact Our Team</h1>
                            <p className="text-gray-600 mb-8">Fill out the form below and we will get back to you within 24 hours.</p>

                            {isSubmitted ? (
                                <div 
                                    role="status" 
                                    className="bg-green-50 border-l-4 border-green-600 p-6 text-green-800"
                                    tabIndex="-1"
                                >
                                    <h2 className="text-xl font-bold mb-2">Message Sent Successfully!</h2>
                                    <p>Thank you for reaching out. Our team will contact you shortly.</p>
                                    <button 
                                        onClick={() => { setIsSubmitted(false); setFormData({fullName: '', email: '', phone: '', company: '', subject: '', message: '', terms: false}); }}
                                        className="mt-4 bg-green-600 text-white px-4 py-2 rounded-md font-medium hover:bg-green-700 focus:ring-2 ring-green-600 ring-offset-2"
                                    >
                                        Send another message
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} noValidate className="space-y-8">
                                    
                                    {Object.keys(errors).length > 0 && (
                                        <div 
                                            ref={errorSummaryRef} 
                                            tabIndex="-1" 
                                            role="alert" 
                                            className="bg-red-50 border border-red-600 p-4 rounded-md"
                                        >
                                            <h2 className="text-red-800 font-bold text-lg mb-2">
                                                The form has {Object.keys(errors).length} errors:
                                            </h2>
                                            <ul className="list-disc pl-5 text-red-700">
                                                {Object.entries(errors).map(([field, msg]) => (
                                                    <li key={field}>
                                                        <a href={`#${field}`} className="underline hover:text-red-900">
                                                            {msg}
                                                        </a>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}

                                    <fieldset className="border-none p-0 m-0 space-y-6">
                                        <legend className="sr-only">Personal and Company Information</legend>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="flex flex-col">
                                                <label htmlFor="fullName" className="font-semibold mb-2 text-gray-800">
                                                    Full Name <span aria-hidden="true" className="text-red-600">*</span>
                                                    <span className="sr-only">(required)</span>
                                                </label>
                                                <input 
                                                    type="text" 
                                                    id="fullName" 
                                                    name="fullName"
                                                    autoComplete="name"
                                                    value={formData.fullName}
                                                    onChange={handleChange}
                                                    aria-required="true"
                                                    aria-invalid={errors.fullName ? "true" : undefined}
                                                    aria-describedby={errors.fullName ? "fullName-error" : undefined}
                                                    className={`p-3 border rounded-md focus:ring-2 ring-blue-600 outline-none ${errors.fullName ? 'border-red-600' : 'border-gray-500'}`}
                                                />
                                                {errors.fullName && <p id="fullName-error" className="text-red-700 text-sm mt-1">{errors.fullName}</p>}
                                            </div>

                                            <div className="flex flex-col">
                                                <label htmlFor="email" className="font-semibold mb-2 text-gray-800">
                                                    Email Address <span aria-hidden="true" className="text-red-600">*</span>
                                                    <span className="sr-only">(required)</span>
                                                </label>
                                                <input 
                                                    type="email" 
                                                    id="email" 
                                                    name="email"
                                                    autoComplete="email"
                                                    value={formData.email}
                                                    onChange={handleChange}
                                                    aria-required="true"
                                                    aria-invalid={errors.email ? "true" : undefined}
                                                    aria-describedby={errors.email ? "email-error" : undefined}
                                                    className={`p-3 border rounded-md focus:ring-2 ring-blue-600 outline-none ${errors.email ? 'border-red-600' : 'border-gray-500'}`}
                                                />
                                                {errors.email && <p id="email-error" className="text-red-700 text-sm mt-1">{errors.email}</p>}
                                            </div>

                                            <div className="flex flex-col">
                                                <label htmlFor="phone" className="font-semibold mb-2 text-gray-800">
                                                    Phone Number <span aria-hidden="true" className="text-red-600">*</span>
                                                    <span className="sr-only">(required)</span>
                                                </label>
                                                <input 
                                                    type="tel" 
                                                    id="phone" 
                                                    name="phone"
                                                    autoComplete="tel"
                                                    value={formData.phone}
                                                    onChange={handleChange}
                                                    aria-required="true"
                                                    aria-invalid={errors.phone ? "true" : undefined}
                                                    aria-describedby={errors.phone ? "phone-error" : undefined}
                                                    className={`p-3 border rounded-md focus:ring-2 ring-blue-600 outline-none ${errors.phone ? 'border-red-600' : 'border-gray-500'}`}
                                                />
                                                {errors.phone && <p id="phone-error" className="text-red-700 text-sm mt-1">{errors.phone}</p>}
                                            </div>

                                            <div className="flex flex-col">
                                                <label htmlFor="company" className="font-semibold mb-2 text-gray-800">
                                                    Company Name
                                                </label>
                                                <input 
                                                    type="text" 
                                                    id="company" 
                                                    name="company"
                                                    autoComplete="organization"
                                                    value={formData.company}
                                                    onChange={handleChange}
                                                    className="p-3 border border-gray-500 rounded-md focus:ring-2 ring-blue-600 outline-none"
                                                />
                                            </div>
                                        </div>
                                    </fieldset>

                                    <div className="space-y-6">
                                        <div className="flex flex-col">
                                            <label htmlFor="subject" className="font-semibold mb-2 text-gray-800">
                                                Subject <span aria-hidden="true" className="text-red-600">*</span>
                                                <span className="sr-only">(required)</span>
                                            </label>
                                            <select 
                                                id="subject" 
                                                name="subject"
                                                value={formData.subject}
                                                onChange={handleChange}
                                                aria-required="true"
                                                aria-invalid={errors.subject ? "true" : undefined}
                                                aria-describedby={errors.subject ? "subject-error" : undefined}
                                                className={`p-3 border rounded-md bg-white focus:ring-2 ring-blue-600 outline-none ${errors.subject ? 'border-red-600' : 'border-gray-500'}`}
                                            >
                                                <option value="">-- Please choose an option --</option>
                                                <option value="sales">Sales Inquiry</option>
                                                <option value="support">Technical Support</option>
                                                <option value="billing">Billing Issue</option>
                                                <option value="other">Other</option>
                                            </select>
                                            {errors.subject && <p id="subject-error" className="text-red-700 text-sm mt-1">{errors.subject}</p>}
                                        </div>

                                        <div className="flex flex-col">
                                            <label htmlFor="message" className="font-semibold mb-2 text-gray-800">
                                                Your Message <span aria-hidden="true" className="text-red-600">*</span>
                                                <span className="sr-only">(required)</span>
                                            </label>
                                            <textarea 
                                                id="message" 
                                                name="message"
                                                rows="5"
                                                value={formData.message}
                                                onChange={handleChange}
                                                aria-required="true"
                                                aria-invalid={errors.message ? "true" : undefined}
                                                aria-describedby={errors.message ? "message-error" : undefined}
                                                className={`p-3 border rounded-md focus:ring-2 ring-blue-600 outline-none ${errors.message ? 'border-red-600' : 'border-gray-500'}`}
                                            ></textarea>
                                            {errors.message && <p id="message-error" className="text-red-700 text-sm mt-1">{errors.message}</p>}
                                        </div>

                                        <div className="flex items-start gap-3">
                                            <div className="flex items-center h-5">
                                                <input 
                                                    id="terms" 
                                                    name="terms"
                                                    type="checkbox" 
                                                    checked={formData.terms}
                                                    onChange={handleChange}
                                                    aria-required="true"
                                                    aria-invalid={errors.terms ? "true" : undefined}
                                                    aria-describedby={errors.terms ? "terms-error" : undefined}
                                                    className="w-5 h-5 text-blue-600 border-gray-500 rounded focus:ring-blue-600"
                                                />
                                            </div>
                                            <div className="flex flex-col">
                                                <label htmlFor="terms" className="text-gray-800 font-medium">
                                                    I agree
