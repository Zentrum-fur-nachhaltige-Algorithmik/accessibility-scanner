<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Accessible Form Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .skip-link { position: absolute; top: -40px; left: 0; background: #1b2a4a; color: white; padding: 8px; z-index: 100; }
        .skip-link:focus { top: 0; }
        :focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 leading-relaxed">
    <div id="app">
        <a href="#main-content" class="skip-link">Skip to main content</a>
        
        <header class="bg-white border-b border-gray-200 p-4">
            <nav aria-label="Main navigation">
                <h1 class="text-xl font-bold">Accessible Contact Form</h1>
            </nav>
        </header>

        <main id="main-content" tabindex="-1" class="max-w-2xl mx-auto p-4 md:py-8">
            <div v-if="submitted" role="status" class="p-6 bg-green-50 border border-green-200 rounded-md">
                <h2 class="text-green-800 font-bold">Successfully submitted!</h2>
                <p>Thank you for reaching out. We will get back to you shortly.</p>
                <button @click="resetForm" class="mt-4 px-4 py-2 bg-green-700 text-white rounded hover:bg-green-800">Send another message</button>
            </div>

            <form v-else @submit.prevent="validateForm" novalidate class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-2xl font-bold mb-6">Contact Us</h2>
                
                <div v-if="Object.keys(errors).length > 0" ref="errorSummary" tabindex="-1" role="alert" class="mb-6 p-4 bg-red-50 border border-red-300 rounded">
                    <h3 class="font-bold text-red-800">Please correct the following errors:</h3>
                    <ul class="list-disc pl-5 mt-2">
                        <li v-for="(msg, field) in errors" :key="field">
                            <a :href="`#${field}`" class="text-red-700 underline">{{msg}}</a>
                        </li>
                    </ul>
                </div>

                <div class="space-y-4">
                    <div v-for="field in ['name', 'email', 'phone', 'company', 'subject', 'message']" :key="field">
                        <label :for="field" class="block font-medium mb-1 capitalize">
                            {{field}} <span aria-hidden="true">*</span><span class="sr-only">(required)</span>
                        </label>
                        
                        <input v-if="field !== 'message' && field !== 'subject'" 
                            :id="field" v-model="formData[field]" :type="field === 'email' ? 'email' : 'text'"
                            :autocomplete="field" :aria-invalid="!!errors[field]" :aria-describedby="errors[field] ? `${field}-error` : null"
                            class="w-full p-2 border rounded" :class="errors[field] ? 'border-red-600' : 'border-gray-300'">
                        
                        <select v-else-if="field === 'subject'" :id="field" v-model="formData[field]"
                            :aria-invalid="!!errors[field]" class="w-full p-2 border rounded border-gray-300">
                            <option value="">Select a subject</option>
                            <option value="support">Technical Support</option>
                            <option value="sales">Sales Inquiry</option>
                        </select>

                        <textarea v-else :id="field" v-model="formData[field]" rows="4"
                            :aria-invalid="!!errors[field]" class="w-full p-2 border rounded border-gray-300"></textarea>
                            
                        <p v-if="errors[field]" :id="`${field}-error`" class="text-red-600 text-sm mt-1" role="alert">{{errors[field]}}</p>
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="terms" v-model="formData.terms" :aria-invalid="!!errors.terms">
                        <label for="terms">I agree to the terms and conditions</label>
                    </div>
                </div>

                <button type="submit" class="mt-6 w-full p-3 bg-blue-700 text-white font-bold rounded hover:bg-blue-800 focus:ring-4 focus:ring-blue-300">
                    Submit Message
                </button>
            </form>
        </main>

        <footer class="text-center p-8 text-gray-500 text-sm">
            &copy; 2024 Accessible Forms Demo. All rights reserved.
        </footer>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue;
        createApp({
            setup() {
                const formData = ref({ name: '', email: '', phone: '', company: '', subject: '', message: '', terms: false });
                const errors = ref({});
                const submitted = ref(false);
                const errorSummary = ref(null);

                const validateForm = async () => {
                    errors.value = {};
                    if (!formData.value.name) errors.value.name = "Name is required";
                    if (!formData.value.email.includes('@')) errors.value.email = "Valid email is required";
                    if (!formData.value.terms) errors.value.terms = "You must agree to the terms";

                    if (Object.keys(errors.value).length > 0) {
                        await nextTick();
                        errorSummary.value.focus();
                    } else {
                        submitted.value = true;
                    }
                };

                const resetForm = () => {
                    formData.value = { name: '', email: '', phone: '', company: '', subject: '', message: '', terms: false };
                    submitted.value = false;
                };

                return { formData, errors, submitted, validateForm, resetForm, errorSummary };
            }
        }).mount('#app');
    </script>
</body>
</html>
