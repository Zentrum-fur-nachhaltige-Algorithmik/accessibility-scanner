# Two services from one image: `app` runs the API and scan engine, `frontend`
# runs the built Next.js UI. Compose reads `.env` from this directory for the
# ${VAR} substitutions; see .env.example.

services:
  app:
    build:
      context: .
      target: production
    image: accessibility-scanner:latest
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      PORT: '3000'
      # Bearer token required on /api/* and /reports/* when set (src/api/auth.js).
      API_TOKEN: ${API_TOKEN:-}
      # Server side only; enables the LLM scanners.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Comma-separated hostname allowlist for scan targets (src/api/url-guard.js).
      SCAN_ALLOWED_HOSTS: ${SCAN_ALLOWED_HOSTS:-}
      # Concurrent scans; each holds a Chrome instance in memory.
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPORT_ORG_NAME: ${REPORT_ORG_NAME:-}
      SCREENSHOT_DIR: /tmp/screenshots
    volumes:
      - reports:/app/reports
    mem_limit: 2g
    # Chrome uses /dev/shm heavily; Docker's 64 MB default crashes it under load.
    shm_size: '1gb'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: .
      target: production
      args:
        API_ORIGIN: http://app:3000
    image: accessibility-scanner:latest
    command: ['node_modules/.bin/next', 'start', 'frontend', '-p', '3001']
    ports:
      - '${FRONTEND_HOST_PORT:-3001}:3001'
    environment:
      API_ORIGIN: http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  reports:
