<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Acme Corp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Screen reader only class */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus visible style */
    :focus-visible {
      outline: 3px solid #1f2937;
      outline-offset: 2px;
    }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #1f2937;
      color: white;
      padding: 0.5rem 1rem;
      z-index: 100;
      text-decoration: none;
      border-radius: 0 0 4px 0;
    }

    .skip-link:focus {
      top: 0;
    }

    /* Form field spacing */
    .form-group {
      margin-bottom: 1.5rem;
    }

    /* Label styling */
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #1f2937;
      font-size: 0.95rem;
    }

    /* Input styling */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 0.625rem;
      border: 2px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.15s ease-in-out;
      background-color: white;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      outline: none;
    }

    /* Invalid state */
    input[aria-invalid="true"],
    textarea[aria-invalid="true"],
    select[aria-invalid="true"] {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    /* Required indicator */
    .required-indicator {
      color: #dc2626;
      font-weight: bold;
    }

    /* Error message */
    .error-message {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.375rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    /* Success message */
    .success-message {
      color: #059669;
      font-size: 0.875rem;
      margin-top: 0.375rem;
    }

    /* Error summary */
    .error-summary {
      background-color: #fee2e2;
      border: 2px solid #dc2626;
      border-radius: 0.375rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      color: #991b1b;
    }

    .error-summary h2 {
      margin: 0 0 0.75rem 0;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .error-summary ul {
      list-style-position: inside;
      margin: 0;
      padding: 0;
    }

    .error-summary li {
      margin-bottom: 0.375rem;
    }

    .error-summary a {
      color: #991b1b;
      text-decoration: underline;
      font-weight: 500;
    }

    .error-summary a:focus {
      outline: 2px solid #1f2937;
      outline-offset: 2px;
    }

    /* Button styling */
    button {
      padding: 0.625rem 1.5rem;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background-color: #2563eb;
      color: white;
      min-width: 120px;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-primary:active {
      background-color: #1e40af;
    }

    .btn-secondary {
      background-color: #e5e7eb;
      color: #1f2937;
    }

    .btn-secondary:hover {
      background-color: #d1d5db;
    }

    /* Button group */
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* Success state */
    .form-success {
      background-color: #ecfdf5;
      border: 2px solid #10b981;
      border-radius: 0.375rem;
      padding: 1rem;
      color: #047857;
      margin-bottom: 1.5rem;
    }

    /* Hint text */
    .hint {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.375rem;
      line-height: 1.5;
    }

    /* Container */
    .container-max {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Heading styles */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: #1f2937;
    }

    .subtitle {
      font-size: 1rem;
      color: #6b7280;
      margin: 0 0 1.5rem 0;
    }

    /* Improve reflow at smaller sizes */
    @media (max-width: 640px) {
      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      h1 {
        font-size: 1.5rem;
      }
    }

    /* Placeholder styling for minimal visibility */
    input::placeholder,
    textarea::placeholder {
      color: #9ca3af;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Skip link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="container-max py-6">
      <h1>Contact Us</h1>
      <p class="subtitle">We'd love to hear from you. Send us a message and we'll get back to you as soon as possible.</p>
    </div>
  </header>

  <!-- Main content -->
  <main id="main-content" class="container-max py-12">
    <div id="app"></div>
  </main>

  <!-- Live region for dynamic announcements -->
  <div id="live-region" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <!-- Vue 3 Application -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, computed, nextTick } = Vue;

    createApp({
      setup() {
        // Form data
        const formData = ref({
          name: '',
          email: '',
          phone: '',
          subject: '',
          message: ''
        });

        // Form state
        const errors = ref({});
        const submitted = ref(false);
        const isSubmitting = ref(false);
        const successMessage = ref('');
        const errorSummaryRef = ref(null);

        // Subject options
        const subjectOptions = [
          { value: '', label: 'Select a subject' },
          { value: 'general', label: 'General Inquiry' },
          { value: 'support', label: 'Technical Support' },
          { value: 'sales', label: 'Sales Question' },
          { value: 'feedback', label: 'Feedback' },
          { value: 'other', label: 'Other' }
        ];

        // Validation function
        const validateForm = () => {
          const newErrors = {};

          // Name validation
          if (!formData.value.name.trim()) {
            newErrors.name = 'Please enter your name.';
          } else if (formData.value.name.trim().length < 2) {
            newErrors.name = 'Name must be at least 2 characters.';
          }

          // Email validation
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!formData.value.email.trim()) {
            newErrors.email = 'Please enter your email address.';
          } else if (!emailRegex.test(formData.value.email.trim())) {
            newErrors.email = 'Please enter a valid email address.';
          }

          // Phone validation (optional, but if provided, must be valid)
          if (formData.value.phone.trim()) {
            const phoneRegex = /^[\d\s\-\+\(\)]+$/;
            if (!phoneRegex.test(formData.value.phone.trim())) {
              newErrors.phone = 'Please enter a valid phone number.';
            } else if (formData.value.phone.replace(/\D/g, '').length < 10) {
              newErrors.phone = 'Phone number must contain at least 10 digits.';
            }
          }

          // Subject validation
          if (!formData.value.subject) {
            newErrors.subject = 'Please select a subject.';
          }

          // Message validation
          if (!formData.value.message.trim()) {
            newErrors.message = 'Please enter your message.';
          } else if (formData.value.message.trim().length < 10) {
            newErrors.message = 'Message must be at least 10 characters.';
          }

          return newErrors;
        };

        // Handle form submission
        const handleSubmit = async () => {
          errors.value = validateForm();
          submitted.value = true;
          successMessage.value = '';

          if (Object.keys(errors.value).length > 0) {
            // Announce error to screen readers
            announceToLiveRegion(`Form has ${Object.keys(errors.value).length} error(s). Please review the fields marked in red.`);

            // Focus error summary
            await nextTick();
            if (errorSummaryRef.value) {
              errorSummaryRef.value.focus();
            }
            return;
          }

          // Simulate form submission
          isSubmitting.value = true;
          announceToLiveRegion('Submitting form...');

          setTimeout(() => {
            isSubmitting.value = false;
            successMessage.value = 'Thank you! Your message has been sent successfully. We\'ll be in touch within 24 hours.';
            submitted.value = false;
            errors.value = {};

            // Reset form
            formData.value = {
              name: '',
              email: '',
              phone: '',
              subject: '',
              message: ''
            };

            announceToLiveRegion('Form submitted successfully. Your message has been sent.');
          }, 1500);
        };

        // Handle reset
        const handleReset = () => {
          formData.value = {
            name: '',
            email: '',
            phone: '',
            subject: '',
            message: ''
          };
          errors.value = {};
          submitted.value = false;
          successMessage.value = '';
          announceToLiveRegion('Form cleared.');
        };

        // Clear individual field error
        const clearFieldError = (fieldName) => {
          if (errors.value[fieldName]) {
            delete errors.value[fieldName];
          }
        };

        // Announce to live region
        const announceToLiveRegion = (message) => {
          const liveRegion = document.getElementById('live-region');
          if (liveRegion) {
            liveRegion.textContent = message;
          }
        };

        // Check if form has any changes
        const hasChanges = computed(() => {
          return Object.values(formData.value).some(val => val.trim() !== '');
        });

        return {
          formData,
          errors,
          submitted,
          isSubmitting,
          successMessage,
          errorSummaryRef,
          subjectOptions,
          handleSubmit,
          handleReset,
          clearFieldError,
          hasChanges
        };
      },
      template: `
        <form @submit.prevent="handleSubmit" novalidate class="space-y-6">
          <!-- Success message -->
          <div v-if="successMessage" class="form-success" role="alert">
            <strong>Success!</strong> {{ successMessage }}
          </div>

          <!-- Error summary -->
          <div
            v-if="submitted && Object.keys(errors).length > 0"
            ref="errorSummaryRef"
            tabindex="-1"
            role="alert"
            class="error-summary"
          >
            <h2>Please correct the following {{ Object.keys(errors).length }} error(s):</h2>
            <ul>
              <li v-for="(message, field) in errors" :key="field">
                <a :href="'#' + field">{{ message }}</a>
              </li>
            </ul>
          </div>

          <!-- Name field (Interactive element 1) -->
          <div class="form-group">
            <label for="name">
              Full Name
              <span aria-hidden="true" class="required-indicator">*</span>
              <span class="sr-only">(required)</span>
            </label>
            <input
              id="name"
              v-model="formData.name"
              type="text"
              autocomplete="name"
              aria-required="true"
              :aria-invalid="!!errors.name"
              :aria-describedby="errors.name ? 'name-error' : undefined"
              @focus="clearFieldError('name')"
              placeholder="John Smith"
            >
            <p v-if="errors.name" id="name-error" class="error-message" role="alert">
              <span aria-hidden="true">✕</span>
              {{ errors.name }}
            </p>
          </div>

          <!-- Email field (Interactive element 2) -->
          <div class="form-group">
            <label for="email">
              Email Address
              <span aria-hidden="true" class="required-indicator">*</span>
              <span class="sr-only">(required)</span>
            </label>
            <input
              id="email"
              v-model="formData.email"
              type="email"
              autocomplete="email"
              aria-required="true"
              :aria-invalid="!!errors.email"
              :aria-describedby="errors.email ? 'email-error' : 'email-hint'"
              @focus="clearFieldError('email')"
              placeholder="john@example.com"
            >
            <p id="email-hint" class="hint">We'll never share your email address.</p>
            <p v-if="errors.email" id="email-error" class="error-message" role="alert">
              <span aria-hidden="true">✕</span>
              {{ errors.email }}
            </p>
          </div>

          <!-- Phone field (Interactive element 3) -->
          <div class="form-group">
            <label for="phone">
              Phone Number
              <span class="sr-only">(optional)</span>
            </label>
            <input
              id="phone"
              v-model="formData.phone"
              type="tel"
              autocomplete="tel"
              :aria-invalid="!!errors.phone"
              :aria-describedby="errors.phone ? 'phone-error' : 'phone-hint'"
              @focus="clearFieldError('phone')"
              placeholder="+1 (555) 123-4567"
            >
            <p id="phone-hint" class="hint">Include country code if international.</p>
            <p v-if="errors.phone" id="phone-error" class="error-message" role="alert">
              <span aria-hidden="true">✕</span>
              {{ errors.phone }}
            </p>
          </div>

          <!-- Subject dropdown (Interactive element 4) -->
          <div class="form-group">
            <label for="subject">
              Subject
              <span aria-hidden="true" class="required-indicator">*</span>
              <span class="sr-only">(required)</span>
            </label>
            <select
              id="subject"
              v-model="formData.subject"
              aria-required="true"
              :aria-invalid="!!errors.subject"
              :aria-describedby="errors.subject ? 'subject-error' : undefined"
              @focus="clearFieldError('subject')"
            >
              <option v-for="opt in subjectOptions" :key="opt.value" :value="opt.value">
                {{ opt.label }}
              </option>
            </select>
            <p v-if="errors.subject" id="subject-error" class="error-message" role="alert">
              <span aria-hidden="true">✕</span>
              {{ errors.subject }}
            </p>
          </div>

          <!-- Message field (Interactive element 5) -->
          <div class="form-group">
            <label for="message">
              Message
              <span aria-hidden="true" class="required-indicator">*</span>
              <span class="sr-only">(required)</span>
            </label>
            <textarea
              id="message"
              v-model="formData.message"
              rows="6"
              autocomplete="off"
              aria-required="true"
              :aria-invalid="!!errors.message"
              :aria-describedby="errors.message ? 'message-error' : 'message-hint'"
              @focus="clearFieldError('message')"
              placeholder="Tell us more about your inquiry..."
              style="resize: vertical; min-height: 150px;"
            ></textarea>
            <p id="message-hint" class="hint">Please provide as much detail as possible to help us assist you better.</p>
            <p v-if="errors.message" id="message-error" class="error-message" role="alert">
              <span aria-hidden="true">✕</span>
              {{ errors.message }}
            </p>
          </div>

          <!-- Button group (Interactive elements 6-8: Submit, Reset, and potential focus management) -->
          <div class="button-group">
            <button
              type="submit"
              class="btn-primary"
              :disabled="isSubmitting"
              :aria-busy="isSubmitting"
            >
              {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>
            <button
              type="button"
              class="btn-secondary"
              @click="handleReset"
              :disabled="!hasChanges && !successMessage"
              title="Clear all form fields"
            >
              Clear Form
            </button>
          </div>

          <p class="hint" style="margin-top: 1.5rem;">
            <span aria-hidden="true">*</span> Indicates a required field
          </p>
        </form>
      `
    }).mount('#app');
  </script>
</body>
</html>
