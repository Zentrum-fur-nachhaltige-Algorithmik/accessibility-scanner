<!-- WCAG-TEST
criterion: 1.3.1
level: A
title: Info and Relationships
test_type: good
expected_violations: 0
testable_by: browser
scanners: screen-reader
description: A three-column table of plain values whose first row is not drawn as a header, whose cells are not merged, and whose meaning each row carries by itself. There is no header axis on the screen, so there is no relationship the markup lost.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good: a list laid out as a table</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; background: #ffffff; }
  main { padding: 2rem; }
  table { border-collapse: collapse; }
  td { border: 1px solid #767676; padding: 0.4rem 0.75rem; font-weight: 400; background: transparent; }
</style>
</head>
<body>
<main>
  <h1>Opening hours</h1>
  <table>
    <caption>Every day of the week, the same three facts</caption>
    <tbody>
      <tr><td>Monday</td><td>09:00</td><td>17:00</td></tr>
      <tr><td>Tuesday</td><td>09:00</td><td>17:00</td></tr>
      <tr><td>Wednesday</td><td>09:00</td><td>13:00</td></tr>
      <tr><td>Thursday</td><td>09:00</td><td>17:00</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
