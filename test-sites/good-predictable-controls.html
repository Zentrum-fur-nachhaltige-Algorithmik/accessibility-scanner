<!-- WCAG-TEST
criterion: 3.2.1, 3.2.2
level: A
title: On Focus, On Input
test_type: good
expected_violations: 0
testable_by: dom
scanners: predictable-navigation
description: Autofocus inside a dialog, a positive tabindex and controls whose change only rewrites text on the page: nothing here changes the user's context
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predictable controls</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
        background: #fff;
        margin: 2rem;
      }
      dialog {
        border: 2px solid #333;
        padding: 1rem;
      }
      .hint {
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Predictable controls</h1>

    <!-- A dialog that is open on load and puts focus on its first field. -->
    <dialog open aria-labelledby="filter-title">
      <h2 id="filter-title">Filter the results</h2>
      <label for="term">Search term</label>
      <input id="term" type="search" autofocus />
      <button type="button">Apply</button>
    </dialog>

    <form>
      <p>
        <label for="lang">Language</label>
        <select id="lang" tabindex="12">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
        <button type="submit">Change language</button>
      </p>

      <fieldset>
        <legend>Delivery</legend>
        <p>
          <label><input type="radio" name="delivery" value="post" checked /> By post</label>
        </p>
        <p>
          <label><input type="radio" name="delivery" value="mail" /> By e-mail</label>
        </p>
        <p>
          <label><input type="checkbox" name="copy" /> Send me a copy</label>
        </p>
      </fieldset>

      <p>
        <label for="notes">Notes</label>
        <textarea id="notes" rows="3"></textarea>
      </p>
      <p class="hint" id="summary">Nothing selected yet.</p>
    </form>

    <script>
      // Every handler writes into the page and leaves the context alone.
      const summary = document.getElementById('summary');
      for (const control of document.querySelectorAll('input, select, textarea')) {
        control.addEventListener('change', () => {
          summary.textContent = `Last change: ${control.name || control.id}`;
        });
        control.addEventListener('focus', () => {
          summary.dataset.focused = control.id || control.name || '';
        });
      }
    </script>
  </body>
</html>
