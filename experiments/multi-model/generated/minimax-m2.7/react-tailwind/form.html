<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Acme Corporation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    html {
      scroll-padding-top: 60px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            focusBlue: '#1d4ed8',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function ContactForm() {
      const [formData, setFormData] = useState({
        firstName: '',
        lastName: '',
        email: '',
        phone: '',
        company: '',
        department: '',
        message: '',
        terms: false
      });

      const [errors, setErrors] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [touched, setTouched] = useState({});
      const errorSummaryRef = useRef(null);
      const firstErrorRef = useRef(null);

      const departments = [
        { value: '', label: 'Select a department' },
        { value: 'sales', label: 'Sales' },
        { value: 'support', label: 'Customer Support' },
        { value: 'billing', label: 'Billing' },
        { value: 'partnerships', label: 'Partnerships' },
        { value: 'careers', label: 'Careers' },
        { value: 'press', label: 'Press & Media' }
      ];

      const validate = (data) => {
        const newErrors = {};

        if (!data.firstName.trim()) {
          newErrors.firstName = 'First name is required';
        }

        if (!data.lastName.trim()) {
          newErrors.lastName = 'Last name is required';
        }

        if (!data.email.trim()) {
          newErrors.email = 'Email address is required';
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
          newErrors.email = 'Please enter a valid email address';
        }

        if (data.phone && !/^[\d\s\-\+\(\)]{7,}$/.test(data.phone)) {
          newErrors.phone = 'Please enter a valid phone number';
        }

        if (!data.department) {
          newErrors.department = 'Please select a department';
        }

        if (!data.message.trim()) {
          newErrors.message = 'Message is required';
        } else if (data.message.trim().length < 20) {
          newErrors.message = 'Message must be at least 20 characters';
        }

        if (!data.terms) {
          newErrors.terms = 'You must agree to the terms and conditions';
        }

        return newErrors;
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));

        if (touched[name]) {
          const newErrors = validate({
            ...formData,
            [name]: type === 'checkbox' ? checked : value
          });
          setErrors(prev => ({ ...prev, [name]: newErrors[name] }));
        }
      };

      const handleBlur = (e) => {
        const { name } = e.target;
        setTouched(prev => ({ ...prev, [name]: true }));
        const newErrors = validate(formData);
        setErrors(prev => ({ ...prev, [name]: newErrors[name] }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const newErrors = validate(formData);
        setErrors(newErrors);
        setTouched({
          firstName: true, lastName: true, email: true,
          phone: true, company: true, department: true,
          message: true, terms: true
        });

        if (Object.keys(newErrors).length > 0) {
          requestAnimationFrame(() => {
            firstErrorRef.current?.focus();
          });
          return;
        }

        setIsSubmitted(true);
        requestAnimationFrame(() => {
          document.getElementById('success-message')?.focus();
        });
      };

      const handleReset = () => {
        setFormData({
          firstName: '', lastName: '', email: '', phone: '',
          company: '', department: '', message: '', terms: false
        });
        setErrors({});
        setTouched({});
        setIsSubmitted(false);
        document.getElementById('firstName')?.focus();
      };

      if (isSubmitted) {
        return (
          <div className="max-w-2xl mx-auto px-4 py-16">
            <div
              id="success-message"
              tabIndex={-1}
              role="alert"
              aria-live="assertive"
              className="bg-green-50 border border-green-600 rounded-lg p-8 text-center focus:outline-none focus:ring-4 focus:ring-green-300"
            >
              <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg className="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              <h2 className="text-2xl font-bold text-green-800 mb-2">Thank You!</h2>
              <p className="text-green-700 mb-6">
                Your message has been sent successfully. We'll get back to you within 1-2 business days.
              </p>
              <button
                type="button"
                onClick={handleReset}
                className="inline-flex items-center justify-center px-6 py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 transition-colors min-h-[44px]"
              >
                Send Another Message
              </button>
            </div>
          </div>
        );
      }

      const hasErrors = Object.keys(errors).length > 0;

      return (
        <div className="max-w-2xl mx-auto px-4 py-12">
          <div className="mb-8">
            <h1 className="text-3xl font-bold text-gray-900 mb-2">Contact Us</h1>
            <p className="text-gray-600">Fill out the form below and we'll get back to you as soon as possible.</p>
          </div>

          {hasErrors && (
            <div
              ref={errorSummaryRef}
              tabIndex={-1}
              role="alert"
              aria-live="assertive"
              className="bg-red-50 border border-red-600 rounded-lg p-4 mb-6 focus:outline-none focus:ring-4 focus:ring-red-300"
            >
              <h2 className="text-red-800 font-semibold mb-2 flex items-center gap-2">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Please correct the following errors:
              </h2>
              <ul className="list-disc list-inside text-red-700 space-y-1">
                {Object.entries(errors).map(([field, message]) => (
                  <li key={field}>
                    <a href={`#${field}`} className="underline hover:no-underline">
                      {message}
                    </a>
                  </li>
                ))}
              </ul>
            </div>
          )}

          <form onSubmit={handleSubmit} noValidate className="bg-white rounded-xl shadow-lg p-8 space-y-6">
            <fieldset className="border-none p-0 m-0">
              <legend className="text-lg font-semibold text-gray-900 mb-4">Personal Information</legend>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                  <label htmlFor="firstName" className="block text-sm font-medium text-gray-700 mb-1">
                    First Name <span aria-hidden="true" className="text-red-600">*</span>
                    <span className="sr-only">(required)</span>
                  </label>
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    value={formData.firstName}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    aria-required="true"
                    aria-invalid={touched.firstName && errors.firstName ? 'true' : undefined}
                    aria-describedby={errors.firstName && touched.firstName ? 'firstName-error' : undefined}
                    autoComplete="given-name"
                    className={`w-full px-4 py-3 rounded-lg border-2 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-200 ${
                      touched.firstName && errors.firstName
                        ? 'border-red-500 bg-red-50'
                        : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                    }`}
                    ref={Object.keys(errors).length > 0 && errors.firstName ? firstErrorRef : null}
                  />
                  {touched.firstName && errors.firstName && (
                    <p id="firstName-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                      <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                      </svg>
                      {errors.firstName}
                    </p>
                  )}
                </div>

                <div>
                  <label htmlFor="lastName" className="block text-sm font-medium text-gray-700 mb-1">
                    Last Name <span aria-hidden="true" className="text-red-600">*</span>
                    <span className="sr-only">(required)</span>
                  </label>
                  <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    value={formData.lastName}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    aria-required="true"
                    aria-invalid={touched.lastName && errors.lastName ? 'true' : undefined}
                    aria-describedby={errors.lastName && touched.lastName ? 'lastName-error' : undefined}
                    autoComplete="family-name"
                    className={`w-full px-4 py-3 rounded-lg border-2 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-200 ${
                      touched.lastName && errors.lastName
                        ? 'border-red-500 bg-red-50'
                        : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                    }`}
                  />
                  {touched.lastName && errors.lastName && (
                    <p id="lastName-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                      <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                      </svg>
                      {errors.lastName}
                    </p>
                  )}
                </div>
              </div>
            </fieldset>

            <div>
              <label htmlFor="email" className="block text-sm font-medium text-gray-700 mb-1">
                Email Address <span aria-hidden="true" className="text-red-600">*</span>
                <span className="sr-only">(required)</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                value={formData.email}
                onChange={handleChange}
                onBlur={handleBlur}
                aria-required="true"
                aria-invalid={touched.email && errors.email ? 'true' : undefined}
                aria-describedby={errors.email && touched.email ? 'email-error' : undefined}
                autoComplete="email"
                className={`w-full px-4 py-3 rounded-lg border-2 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-200 ${
                  touched.email && errors.email
                    ? 'border-red-500 bg-red-50'
                    : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                }`}
              />
              {touched.email && errors.email && (
                <p id="email-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                  </svg>
                  {errors.email}
                </p>
              )}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label htmlFor="phone" className="block text-sm font-medium text-gray-700 mb-1">
                  Phone Number
                  <span className="text-gray-500 font-normal ml-1">(optional)</span>
                </label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  value={formData.phone}
                  onChange={handleChange}
                  onBlur={handleBlur}
                  aria-invalid={touched.phone && errors.phone ? 'true' : undefined}
                  aria-describedby={errors.phone && touched.phone ? 'phone-error' : undefined}
                  autoComplete="tel"
                  className={`w-full px-4 py-3 rounded-lg border-2 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-200 ${
                    touched.phone && errors.phone
                      ? 'border-red-500 bg-red-50'
                      : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                  }`}
                />
                {touched.phone && errors.phone && (
                  <p id="phone-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                      <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                    </svg>
                    {errors.phone}
                  </p>
                )}
              </div>

              <div>
                <label htmlFor="company" className="block text-sm font-medium text-gray-700 mb-1">
                  Company
                  <span className="text-gray-500 font-normal ml-1">(optional)</span>
                </label>
                <input
                  type="text"
                  id="company"
                  name="company"
                  value={formData.company}
                  onChange={handleChange}
                  onBlur={handleBlur}
                  autoComplete="organization"
                  className="w-full px-4 py-3 rounded-lg border-2 border-gray-600 hover:border-gray-700 transition-colors focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-200"
                />
              </div>
            </div>

            <div>
              <label htmlFor="department" className="block text-sm font-medium text-gray-700 mb-1">
                Department <span aria-hidden="true" className="text-red-600">*</span>
                <span className="sr-only">(required)</span>
              </label>
              <div className="relative">
                <select
                  id="department"
                  name="department"
                  value={formData.department}
                  onChange={handleChange}
                  onBlur={handleBlur}
                  aria-required="true"
                  aria-invalid={touched.department && errors.department ? 'true' : undefined}
                  aria-describedby={errors.department && touched.department ? 'department-error' : undefined}
                  className={`w-full px-4 py-3 rounded-lg border-2 transition-colors appearance-none bg-white focus:outline-none focus:ring-4 focus:ring-blue-200 ${
                    touched.department && errors.department
                      ? 'border-red-500 bg-red-50'
                      : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                  }`}
                >
                  {departments.map(dept => (
                    <option key={dept.value} value={dept.value} disabled={dept.value === ''}>
                      {dept.label}
                    </option>
                  ))}
                </select>
                <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <svg className="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
              {touched.department && errors.department && (
                <p id="department-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                  </svg>
                  {errors.department}
                </p>
              )}
            </div>

            <div>
              <label htmlFor="message" className="block text-sm font-medium text-gray-700 mb-1">
                Message <span aria-hidden="true" className="text-red-600">*</span>
                <span className="sr-only">(required)</span>
              </label>
              <textarea
                id="message"
                name="message"
                value={formData.message}
                onChange={handleChange}
                onBlur={handleBlur}
                rows={5}
                aria-required="true"
                aria-invalid={touched.message && errors.message ? 'true' : undefined}
                aria-describedby={errors.message && touched.message ? 'message-error' : 'message-hint'}
                className={`w-full px-4 py-3 rounded-lg border-2 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-200 resize-y min-h-[120px] ${
                  touched.message && errors.message
                    ? 'border-red-500 bg-red-50'
                    : 'border-gray-600 hover:border-gray-700 focus:border-blue-600'
                }`}
              ></textarea>
              <p id="message-hint" className="mt-1 text-sm text-gray-500">
                Minimum 20 characters. Please describe your inquiry in detail.
              </p>
              {touched.message && errors.message && (
                <p id="message-error" className="mt-1 text-sm text-red-600 flex items-center gap-1">
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                  </svg>
                  {errors.message}
                </p>
              )}
            </div>

            <div className="bg-gray-50 rounded-lg p-4">
              <div className="flex items-start gap-3">
                <input
                  type="checkbox"
                  id="terms"
                  name="terms"
                  checked={formData.terms}
                  onChange={handleChange}
                  onBlur={handleBlur}
                  aria-required="true"
                  aria-invalid={touched.terms && errors.terms ? 'true' : undefined}
                  aria-describedby={errors.terms && touched.terms ? 'terms-error' : undefined}
                  className="mt-1 h-5 w-5 rounded border-gray-600 text-blue-600 focus:ring-blue-600 focus:ring-offset-0 cursor-pointer"
                />
                <label htmlFor="terms" className="text-sm text-gray-700 cursor-pointer">
                  <span className="font-medium">I agree to the</span>{' '}
                  <a href="/terms" className="text-blue-700 underline hover:no-underline focus:outline-none focus:ring-2 focus:ring-blue-600 rounded">
                    Terms and Conditions
                  </a>
                  {' '}and{' '}
                  <a href="/privacy" className="text-blue-700 underline hover:no-underline focus:outline-none focus:ring-2 focus:ring-blue-600 rounded">
                    Privacy Policy
                  </a>
                  <span aria-hidden="true" className="text-red-600 ml-1">*</span>
                  <span className="sr-only"> (required)</span>
                </label>
              </div>
              {touched.terms && errors.terms && (
                <p id="terms-error" className="mt-2 text-sm text-red-600 flex items-center gap-1">
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                  </svg>
                  {errors.terms}
                </p>
              )}
            </div>

            <div className="flex flex-col sm:flex-row gap-4 pt-4">
              <button
                type="submit"
                className="inline-flex items-center justify-center px-8 py-3 bg-blue-700 text-white font-medium rounded-lg hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors min-h-[48px] text-lg"
              >
                <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                Send Message
              </button>
              <button
                type="button"
                onClick={handleReset}
                className="inline-flex items-center justify-center px-6 py-3 bg-gray-200 text-gray-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-4 focus:ring-gray-400 transition-colors min-h-[48px]"
              >
                Clear Form
              </button>
            </div>
          </form>

          <p className="mt-6 text-sm text-gray-600 text-center">
            <span className="text-red-600" aria-hidden="true">*</span>
            <span className="sr-only">Required</span> Indicates required field
          </p>
        </div>
      );
    }

    function App() {
      return (
        <>
          <a
            href="#main-content"
            className="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-700 focus:text-white focus:rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-300"
          >
            Skip to main content
          </a>

          <header className="bg-white border-b border-gray-200">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between">
                <a href="/" className="flex items-center gap-3 focus:outline-none focus:ring-4 focus:ring-blue-300 rounded-lg p-1">
                  <div className="w-10 h-10 bg-blue-700 rounded-lg flex items-center justify-center">
                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </div>
                  <span className="text-xl font-bold text-gray-900">Acme Corp</span>
                </a>
                <nav aria-label="Main navigation">
                  <ul className="flex items-center gap-6">
                    <li>
                      <a href="/" className="text-gray-700 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-2 py-1" aria-current="page">
                        Home
                      </a>
                    </li>
                    <li>
                      <a href="/products" className="text-gray-700 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-2 py-1">
                        Products
                      </a>
                    </li>
                    <li>
                      <a href="/about" className="text-gray-700 hover:text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-2 py-1">
                        About
                      </a>
                    </li>
                    <li>
                      <a href="/contact" className="text-blue-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-600 rounded px-2 py-1">
                        Contact
                      </a>
                    </li>
                  </ul>
                </nav>
              </div>
            </div>
          </header>

          <main id="main-content" tabIndex={-1} className="flex-1 outline-none">
            <div className="bg-gradient-to-br from-blue-50 to-indigo-100 py-12">
              <ContactForm />
            </div>
          </main>

          <footer className="bg-gray-900 text-gray-300">
            <div className="max-w-7xl mx-auto px-4 py-12">
